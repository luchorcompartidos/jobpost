<title>Job Post ATS Analizer</title>
<style>

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--bd)}
  .hd{display:flex;align-items:center;gap:10px;max-width:820px;margin:0 auto;padding:10px 14px 6px}
  .hd h1{margin:0;font-size:19px}
  .sp{flex:1}
  nav{display:flex;max-width:820px;margin:0 auto;padding:0 8px}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap;border:0;background:none;padding:6px 2px 8px;font:600 13px system-ui,sans-serif;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer}
  nav button.on{color:var(--ac);border-bottom-color:var(--ac)}
  main{max-width:820px;margin:0 auto;padding:14px 12px 80px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
  h2{font-size:16px;margin:0 0 8px}
  h3{font-size:13px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
  h3:first-child{margin-top:0}
  .mut{color:var(--mut)} .sm{font-size:13px} .warn{color:var(--mid)}
  a{color:var(--ac)}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .btn{border:1px solid var(--bd2);border-radius:10px;padding:8px 13px;background:var(--card);color:var(--tx);text-decoration:none;display:inline-block;font:14px system-ui,sans-serif;cursor:pointer}
  .btn.pri{background:var(--ac);border-color:var(--ac);color:var(--onac)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.danger{color:var(--bad);border-color:var(--dangerb)}
  .btn.xs{padding:4px 9px;font-size:13px;border-radius:8px}
  .ic{border:0;background:none;font-size:18px;padding:6px;cursor:pointer;color:var(--mut);border-radius:8px;line-height:1}
  .ic:hover{background:var(--bg)}
  input,select,textarea{font:15px system-ui,sans-serif;color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:7px 9px;background:var(--inp);min-width:0;width:100%}
  textarea{resize:vertical;line-height:1.4}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--ac2);border-color:var(--ac)}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g3{display:grid;grid-template-columns:1.2fr 1.6fr 1fr auto;gap:8px;align-items:end}
  .mt{margin-top:10px}
  /* Resumen */
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
  .kv dt{color:var(--mut)} .kv dd{margin:0}
  /* Chips */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;background:var(--chip);color:var(--chipt);border:1px solid transparent}
  .chip b{font-weight:700;opacity:.7}
  .chip button{border:0;background:none;padding:0 0 0 2px;font:700 14px system-ui;cursor:pointer;color:inherit}
  .c-L{background:#dbeafe;color:#1e40af}.c-D{background:#dcfce7;color:#166534}.c-C{background:#e0f2fe;color:#075985}
  .c-H{background:#f3e8ff;color:#6b21a8}.c-M{background:#fef3c7;color:#92400e}.c-A{background:#ccfbf1;color:#115e59}
  .c-Q{background:#fce7f3;color:#9d174d}.c-G{background:#ffedd5;color:#9a3412}.c-B{background:var(--chip);color:var(--chipt)}
  .c-X{background:#fee2e2;color:#991b1b}.c-I{background:#ede9fe;color:#5b21b6}.c-P{background:#e2e8f0;color:#0f172a;border-color:#94a3b8}
  html[data-tema=dark] .c-L{background:#1e3a8a66;color:#93c5fd} html[data-tema=dark] .c-D{background:#14532d66;color:#86efac} html[data-tema=dark] .c-C{background:#07598566;color:#7dd3fc}
  html[data-tema=dark] .c-H{background:#581c8766;color:#d8b4fe} html[data-tema=dark] .c-M{background:#78350f66;color:#fcd34d} html[data-tema=dark] .c-A{background:#134e4a99;color:#5eead4}
  html[data-tema=dark] .c-Q{background:#83184366;color:#f9a8d4} html[data-tema=dark] .c-G{background:#7c2d1266;color:#fdba74} html[data-tema=dark] .c-X{background:#7f1d1d66;color:#fca5a5}
  html[data-tema=dark] .c-I{background:#4c1d9566;color:#c4b5fd} html[data-tema=dark] .c-P{background:#33415599;color:#e2e8f0;border-color:#64748b}
  .chip.ok{background:var(--okb);color:var(--ok)} .chip.no{background:var(--badb);color:var(--bad)} .chip.mid{background:var(--midb);color:var(--mid)}
  .pri-h{display:flex;align-items:baseline;gap:8px;margin:12px 0 6px;font-weight:700;font-size:14px}
  .pri-h small{font-weight:400;color:var(--mut)}
  .leg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .leg .chip{font-size:12px;padding:2px 8px}
  ul.recs{margin:4px 0 0;padding-left:20px} ul.recs li{margin:4px 0}
  /* Score */
  .score{display:flex;align-items:center;gap:16px}
  .score .big{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .score .lbl{font-weight:700}
  .meter{height:10px;border-radius:9px;background:var(--meter);overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;border-radius:9px}
  .s-ok{color:var(--ok)} .s-mid{color:var(--mid)} .s-bad{color:var(--bad)}
  .b-ok{background:var(--ok)} .b-mid{background:#d97706} .b-bad{background:var(--bad)}
  table.t{width:100%;border-collapse:collapse;font-size:14px}
  table.t th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:4px}
  table.t td{padding:7px 4px;border-top:1px solid var(--bd);vertical-align:top}
  table.t td small{display:block;color:var(--mut);font-size:12px}
  .st{font-weight:600;min-width:92px}
  table.t td{overflow-wrap:anywhere}
  table.t td:first-child{overflow-wrap:normal}
  @media (max-width:560px){ table.t{font-size:13px} table.t th:first-child,table.t td:first-child{width:28%} }
  ul.chk{list-style:none;margin:0;padding:0} ul.chk li{padding:5px 0;border-top:1px solid var(--bd);display:flex;gap:8px}
  ul.chk li:first-child{border-top:0}
  /* Historial / diccionario */
  .hrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd)}
  .hrow:first-of-type{border-top:0}
  .hrow .ht{flex:1;min-width:0}
  .hrow .ha{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
  .badge.ok{background:var(--okb);color:var(--ok)} .badge.mid{background:var(--midb);color:var(--mid)} .badge.bad{background:var(--badb);color:var(--bad)}
  /* Diálogo */
  .dlg{border:1px solid var(--bd);border-radius:16px;padding:18px;width:min(560px,94vw);color:var(--tx);background:var(--card)}
  .dlg label{margin-top:10px}
  .dlg::backdrop{background:rgba(15,23,42,.35)}
  .dlg h3{margin:0 0 12px;color:var(--tx);text-transform:none;font-size:17px;letter-spacing:0}
  .dlg .acts{justify-content:flex-end}
  .menu .btn{width:100%;text-align:left;margin-bottom:8px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#1c1f26;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9999;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%)}
  .printonly{display:none}
  /* Resaltado */
  .hltx{white-space:pre-wrap;font-size:14px;line-height:1.6;max-height:520px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:8px;background:var(--inp)}
  mark{border-radius:4px;padding:0 2px;color:inherit}
  .hl-ok{background:#bbf7d0}.hl-syn{background:#fde68a}.hl-kw{background:#bfdbfe}
  .hl-exc{background:#fecaca}.hl-req{background:#fed7aa}.hl-resp{background:#bae6fd}.hl-des{background:#ddd6fe}.hl-otro{background:#e2e8f0}
  html[data-tema=dark] .hl-ok{background:#166534aa}html[data-tema=dark] .hl-syn{background:#854d0eaa}html[data-tema=dark] .hl-kw{background:#1e3a8aaa}
  html[data-tema=dark] .hl-exc{background:#7f1d1daa}html[data-tema=dark] .hl-req{background:#7c2d12aa}html[data-tema=dark] .hl-resp{background:#075985aa}html[data-tema=dark] .hl-des{background:#4c1d95aa}html[data-tema=dark] .hl-otro{background:#334155aa}
  details>summary{cursor:pointer;font-weight:600}
  /* Postulaciones */
  .est{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--bd2);color:var(--tx);background:var(--card)}
  .est.e-postulado{border-color:var(--ac);color:var(--ac)} .est.e-entrevista,.est.e-prueba{border-color:#d97706;color:var(--mid)}

  .filt button{border:1px solid var(--bd2);background:var(--card);color:var(--tx);border-radius:999px;padding:4px 10px;font:13px system-ui,sans-serif;cursor:pointer}
  .filt button.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
  .vence{color:var(--bad);font-weight:600} .pronto{color:var(--mid);font-weight:600}
  .tl{list-style:none;margin:6px 0 0;padding:0;font-size:13px;color:var(--mut)} .tl li{padding:2px 0}
  /* Tendencias */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .tile{border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--card)} .tile b{display:block;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums} .tile span{font-size:12px;color:var(--mut)}
  .bars{display:flex;flex-direction:column;gap:7px}
  .bar{display:grid;grid-template-columns:minmax(0,38%) 1fr 64px;gap:8px;align-items:center;font-size:13px}
  .bar .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .bt{height:8px;border-radius:4px;background:var(--meter);overflow:hidden} .bar .bt i{display:block;height:100%;background:var(--ac);border-radius:0 4px 4px 0}
  .bar .bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--tx)}
  .bar:hover .bt i{filter:brightness(1.15)}
  .falta{font-size:11px;color:var(--bad);font-weight:600;margin-left:4px}

  .ia h2 small{font-weight:400;color:var(--mut);font-size:12px}

  .seg button{flex:1;border:0;background:var(--card);color:var(--tx);padding:8px;font:14px system-ui,sans-serif;cursor:pointer}

  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bd2);border-top-color:var(--ac);border-radius:50%;animation:gira .8s linear infinite;vertical-align:-2px}
  @keyframes gira{to{transform:rotate(360deg)}}
  code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:13px}
  /* Bloque de versión en modo oscuro */
  html[data-tema=dark] .vs-ver{background:var(--card);color:var(--mut);border-color:var(--bd2)}
  html[data-tema=dark] .vs-dlg{background:var(--card);color:var(--tx);border-color:var(--bd)}
  html[data-tema=dark] .vs-dlg .vs-mut,html[data-tema=dark] .vs-dlg .vs-rel pre{color:var(--mut)}
  html[data-tema=dark] .vs-dlg .vs-rel{border-color:var(--bd)}
  html[data-tema=dark] .vs-dlg .vs-acts button,html[data-tema=dark] .vs-dlg .vs-acts a{background:var(--card);color:var(--tx);border-color:var(--bd2)}
  html[data-tema=dark] .vs-dlg .vs-acts .vs-pri{background:var(--ac);border-color:var(--ac);color:var(--onac)}
  .src{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--mut);background:var(--ac2);border-radius:9px;padding:6px 10px;margin-top:8px}
  .imp{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
  .busy{opacity:.6;pointer-events:none}
  ol.pasos{margin:6px 0 0;padding-left:20px} ol.pasos li{margin:4px 0}
  @media (max-width:560px){ .g2{grid-template-columns:1fr} .g3{grid-template-columns:1fr 1fr} .kv{grid-template-columns:118px 1fr} .score .big{font-size:38px} }
  @media (max-width:440px){ nav button{font-size:11px;letter-spacing:-.2px} }
  @media print{
    header,nav,.noprint,#toast{display:none!important}
    html,body{background:#fff}
    main{padding:0;max-width:none}
    .card{break-inside:avoid;border-color:#bbb}
    .printonly{display:block;margin:0 0 10px}
    html,html[data-tema=dark]{color-scheme:light;--bg:#fff;--card:#fff;--tx:#111;--mut:#555;--bd:#ccc;--ok:#15803d;--okb:#fff;--mid:#b45309;--midb:#fff;--bad:#b91c1c;--badb:#fff;--chip:#fff;--chipt:#111;--meter:#e5e7eb}
    .chip,html[data-tema=dark] .chip{border:1px solid #bbb;background:#fff!important;color:#111!important}
  }
</style>

    const rows = [];

    rows.forEach(r => r.items.sort((a, b) => a.x - b.x));
    return rows;
  }
  function unir(items){
    let t = "", fin = null;
    items.forEach(it => { if(fin !== null && it.x - fin > it.h * .15 && !/\s$/.test(t) && !/^\s/.test(it.s)) t += " "; t += it.s; fin = it.x + it.w; });
    return t;
  }
  async function leerPdf(buf){
    const pdfjs = await cargarPdfjs();
    let pdf;
    try{ pdf = await pdfjs.getDocument({data: new Uint8Array(buf), isEvalSupported: false}).promise; }
    catch(e){ throw new Error(/password/i.test(e && e.name || "") ? "El PDF tiene contraseña: guardalo sin contraseña e importalo de nuevo." : "No se pudo leer el PDF (¿está dañado?)."); }
    const paginas = pdf.numPages, partes = []; let chars = 0, colPags = 0, imgs = 0;
    const O = pdfjs.OPS || {}, IMG = new Set([O.paintImageXObject, O.paintInlineImageXObject, O.paintImageXObjectRepeat].filter(x => x !== undefined));
    for(let i = 1; i <= paginas; i++){
      const page = await pdf.getPage(i), ancho = page.getViewport({scale: 1}).width;
      const tc = await page.getTextContent();
      const items = tc.items.filter(it => it.str && it.str.trim()).map(it => ({s: it.str, x: it.transform[4], y: it.transform[5], w: it.width || 0, h: Math.abs(it.transform[3]) || 10}));
      chars += items.reduce((a, b) => a + b.s.length, 0);
      const rows = filas(items);
      // Columnas: muchas filas con un hueco grande en el medio
      const huecos = [];
      rows.forEach(r => { let best = 0, pos = 0; for(let k = 1; k < r.items.length; k++){ const a = r.items[k - 1], g = r.items[k].x - (a.x + a.w); if(g > best){ best = g; pos = a.x + a.w + g / 2; } } if(best > ancho * .12) huecos.push(pos); });
      if(huecos.length >= Math.max(5, rows.length * .3)){
        colPags++;
        huecos.sort((a, b) => a - b); const corte = huecos[Math.floor(huecos.length / 2)];
        const izq = filas(items.filter(it => it.x < corte)), der = filas(items.filter(it => it.x >= corte));
        partes.push(izq.map(r => unir(r.items)).join("\n") + "\n\n" + der.map(r => unir(r.items)).join("\n"));
      } else partes.push(rows.map(r => unir(r.items)).join("\n"));
      try{ const ops = await page.getOperatorList(); ops.fnArray.forEach(f => { if(IMG.has(f)) imgs++; }); }catch(e){}
      page.cleanup && page.cleanup();
    }
    const texto = limpia(partes.join("\n\n"));
    const escaneado = chars < 80 * paginas;
    const raro = !escaneado && letras(texto) < .8;
    const checks = [
      ck(!escaneado, escaneado ? "Casi no tiene texto seleccionable (parece escaneado o una imagen): los ATS no lo pueden leer" : "Texto seleccionable"),
      ck(!raro, raro ? "El texto extraído sale con caracteres raros: la fuente del PDF no es legible para un ATS" : "El texto se extrae sin caracteres raros"),
      ck(!colPags, colPags ? `Diseño a dos columnas en ${colPags} página${colPags > 1 ? "s" : ""}: algunos ATS mezclan el orden del texto (acá se reordenó para analizarlo)` : "Una sola columna"),
      ck(paginas <= 2 ? true : null, `${paginas} página${paginas > 1 ? "s" : ""}${paginas > 2 ? " (lo habitual es 1 o 2)" : ""}`)
    ];
    if(imgs > 0) checks.push(ck(null, `Tiene ${imgs} imagen${imgs > 1 ? "es" : ""}: el texto dentro de imágenes no se lee (una foto o un logo no es problema)`));
    if(escaneado && !texto) throw Object.assign(new Error("El PDF no tiene texto seleccionable (parece escaneado). Exportalo de nuevo desde el editor original como PDF con texto, o pegá el texto a mano."), {checks});
    return {texto, tipo: "PDF", paginas, checks};
  }

  // ---------- JSON ----------
  const SEC_CVAPP = {experience: "Experiencia", education: "Educación", courses: "Cursos y certificaciones", skillsHard: "Habilidades", skillsSoft: "Habilidades blandas", languages: "Idiomas"};
  function cvapp(c){
    const oculto = new Set(Array.isArray(c.hiddenSections) ? c.hiddenSections : []);
    const L = [], s = v => sinHtml(typeof v === "string" ? v : "").trim();
    if(s(c.fullName)) L.push(s(c.fullName));
    if(s(c.jobTitle)) L.push(s(c.jobTitle));
    if(!oculto.has("contact")){
      const ct = Array.isArray(c.contactItems) ? c.contactItems.filter(x => x && !["cuil", "birth"].includes(x.type)).map(x => s(x.value))
        : c.contact && typeof c.contact === "object" ? ["location", "phone", "email", "linkedin", "github"].map(k => s(c.contact[k])) : [];
      if(ct.filter(Boolean).length) L.push(ct.filter(Boolean).join(" | "));
    }
    if(!oculto.has("profile") && s(c.profileSummary)) L.push("", "Perfil", s(c.profileSummary));
    const sec = (k, fn) => { if(oculto.has(k) || !Array.isArray(c[k])) return; const rows = c[k].map(x => fn(x || {}).trim()).filter(t => t && !/^[—()·\s]*$/.test(t)); if(rows.length) L.push("", SEC_CVAPP[k], ...rows); };
    sec("experience", x => [[s(x.role), s(x.company)].filter(Boolean).join(" — ") + (s(x.period) ? ` (${s(x.period)})` : ""), s(x.location), s(x.description)].filter(Boolean).join("\n"));
    sec("education", x => [s(x.degree), s(x.institution)].filter(Boolean).join(" — ") + (s(x.period) ? ` (${s(x.period)})` : "") + (s(x.status) ? ` · ${s(x.status)}` : ""));
    sec("courses", x => [s(x.title), s(x.institution)].filter(Boolean).join(" — ") + (s(x.year) ? ` (${s(x.year)})` : ""));
    ["skillsHard", "skillsSoft"].forEach(k => { if(!oculto.has(k) && Array.isArray(c[k]) && c[k].length) L.push("", SEC_CVAPP[k], c[k].map(x => s(typeof x === "string" ? x : x && x.name)).filter(Boolean).join(", ")); });
    sec("languages", x => s(x.name) + (s(x.level) ? `: ${s(x.level)}` : ""));
    return limpia(L.join("\n"));
  }
  function jsonResume(o){
    const L = [], s = v => typeof v === "string" ? v.trim() : "", b = o.basics || {};
    [s(b.name), s(b.label), [s(b.email), s(b.phone), s(b.url), ...(Array.isArray(b.profiles) ? b.profiles.map(p => s(p && p.url)) : [])].filter(Boolean).join(" | ")].filter(Boolean).forEach(x => L.push(x));
    if(s(b.summary)) L.push("", "Perfil", s(b.summary));
    const sec = (t, arr, fn) => { if(!Array.isArray(arr)) return; const rows = arr.map(x => fn(x || {})).filter(Boolean); if(rows.length) L.push("", t, ...rows); };
    const per = x => [s(x.startDate), s(x.endDate) || (s(x.startDate) ? "Actualidad" : "")].filter(Boolean).join(" - ");
    sec("Experiencia", o.work, x => [[s(x.position), s(x.name) || s(x.company)].filter(Boolean).join(" — ") + (per(x) ? ` (${per(x)})` : ""), s(x.summary), ...(Array.isArray(x.highlights) ? x.highlights.map(h => "- " + s(h)) : [])].filter(Boolean).join("\n"));
    sec("Educación", o.education, x => [[s(x.studyType), s(x.area)].filter(Boolean).join(" en "), s(x.institution)].filter(Boolean).join(" — ") + (per(x) ? ` (${per(x)})` : ""));
    sec("Certificaciones", o.certificates, x => [s(x.name), s(x.issuer)].filter(Boolean).join(" — "));
    sec("Proyectos", o.projects, x => [s(x.name), s(x.description)].filter(Boolean).join(": "));
    sec("Habilidades", o.skills, x => [s(x.name), Array.isArray(x.keywords) ? x.keywords.map(s).join(", ") : ""].filter(Boolean).join(": "));
    sec("Idiomas", o.languages, x => s(x.language) + (s(x.fluency) ? `: ${s(x.fluency)}` : ""));
    return limpia(L.join("\n"));
  }
  function generico(o){
    const L = [], salta = /^(id|uid|_id|photo|photourl|foto|imagen|image|picture|avatar|cuil|cuit|dni|birth|nacimiento)$/i;
    const walk = (v, d) => {
      if(d > 8 || L.length > 3000) return;
      if(typeof v === "string"){ if(v.length < 5000 && !/^data:/.test(v)) L.push(sinHtml(v)); }
      else if(Array.isArray(v)) v.forEach(x => walk(x, d + 1));
      else if(v && typeof v === "object") Object.entries(v).forEach(([k, x]) => { if(!salta.test(k)) walk(x, d + 1); });
    };
    walk(o, 0); return limpia(L.join("\n"));
  }
  function desdeJSON(o){
    if(!o || typeof o !== "object") throw new Error("El JSON está vacío o no tiene datos.");
    if(o.app === "jobpost") throw new Error("Ese archivo es un backup de Job Post ATS: importalo desde el menú ⋯ → Importar backup.");
    if(o.app === "editor-cv-argentina" && o.content && typeof o.content === "object")
      return {texto: cvapp(o.content), tipo: "CVAPP (JSON)", checks: [ck(true, "Datos estructurados de CVAPP: se arman las secciones con títulos estándar"), ck(null, "El formato final depende de cómo lo exportes desde CVAPP: para postular, usá el diseño de una columna o el ATS")]};
    if(o.basics || Array.isArray(o.work)) return {texto: jsonResume(o), tipo: "JSON Resume", checks: [ck(true, "Datos estructurados en formato JSON Resume")]};
    return {texto: generico(o), tipo: "JSON", checks: [ck(null, "JSON con formato no reconocido: se tomaron todos sus textos, sin estructura de secciones")]};
  }

  // ---------- HTML a texto (Documento de Google publicado) ----------
  function htmlTexto(html){
    const d = new DOMParser().parseFromString(html, "text/html");
    d.querySelectorAll("script,style,noscript,#header,#footer,#banners").forEach(e => e.remove());
    const L = [];
    d.body.querySelectorAll("p,li,h1,h2,h3,h4,h5,h6,td").forEach(e => { if(!e.querySelector("p,li,td")) L.push((e.tagName === "LI" ? "- " : "") + e.textContent); });
    return limpia(L.length ? L.join("\n") : d.body.textContent);
  }

  // ---------- Entradas públicas ----------
  async function leerArchivo(file){
    if(!file) throw new Error("No se eligió ningún archivo.");
    if(file.size > MAX_MB * 1024 * 1024) throw new Error(`El archivo pesa más de ${MAX_MB} MB.`);
    const nombre = file.name || "archivo", ext = (nombre.match(/\.([a-z0-9]+)$/i) || [])[1]?.toLowerCase() || "";
    let r;
    if(ext === "pdf" || file.type === "application/pdf") r = await leerPdf(await file.arrayBuffer());
    else if(ext === "docx") r = await leerDocx(await file.arrayBuffer());
    else if(ext === "doc") throw new Error("El formato .doc (Word 97-2003) no se puede leer en el navegador. Abrilo en Word o Google Docs y guardalo como .docx o PDF.");
    else if(ext === "json"){ let o; try{ o = JSON.parse(await file.text()); }catch(e){ throw new Error("El archivo no es un JSON válido."); } r = desdeJSON(o); }
    else if(["txt", "md", "text"].includes(ext) || /^text\//.test(file.type)) r = {texto: limpia(await file.text()), tipo: "Texto", checks: [ck(null, "Texto plano: no se puede revisar el diseño del archivo original")]};
    else if(["odt", "pages", "rtf"].includes(ext)) throw new Error(`El formato .${ext} no está soportado. Guardalo como .docx o PDF.`);
    else throw new Error("Formato no soportado. Usá PDF, .docx, .txt o JSON.");
    if(!r.texto) throw new Error("No se encontró texto en el archivo.");
    return {...r, nombre};
  }
  async function leerGoogle(url){
    url = String(url || "").trim();
    const m = url.match(/docs\.google\.com\/document\/d\/(e\/)?([a-zA-Z0-9_-]{20,})/);
    if(!m) throw new Error("El link no es de un Documento de Google (docs.google.com/document/…).");
    const u = m[1] ? `https://docs.google.com/document/d/e/${m[2]}/pub` : `https://docs.google.com/document/d/${m[2]}/export?format=txt`;
    let res;
    try{ res = await fetch(u, {credentials: "omit", cache: "no-store"}); }
    catch(e){ throw Object.assign(new Error("Google no dejó que la app lea el documento directamente."), {google: true}); }
    if(!res.ok) throw Object.assign(new Error(res.status === 404 ? "No se encontró el documento: revisá el link." : "El documento no es público o Google no lo dejó leer."), {google: true});
    const ct = res.headers.get("content-type") || "", body = await res.text();
    const texto = /html/.test(ct) ? htmlTexto(body) : limpia(body.replace(/^﻿/, ""));
    if(!texto || /ServiceLogin|accounts\.google\.com/.test(body.slice(0, 3000))) throw Object.assign(new Error("El documento no es público: Google pide iniciar sesión."), {google: true});
    return {texto, tipo: "Documento de Google", nombre: "Documento de Google", checks: [ck(null, "Documento de Google: para postular, descargalo como .docx o PDF con texto (no como imagen)")]};
  }

  root.CVIMP = {leerArchivo, leerGoogle, desdeJSON, _test: {leerDocx, leerPdf, cvapp, htmlTexto}};
})(window);
</script>

  async function analizarAviso(texto, local){

  }
  async function analizarMatch(aviso, cv, score, cvHash){
    const r = await llamar(SYS, promptMatch(aviso, cv, score), 5000);

  }

  // ---------- Reglas sugeridas: lo que la IA encontró y el diccionario todavía no tiene ----------
  function sugerencias(terms, dict, ATS){
    const N = s => ATS.norm(s).trim().replace(/\s+/g, " ");
    const ok = s => s.length >= 2 && s.length <= 60 && !/^\d+$/.test(s);
    const porAlias = new Map(); dict.forEach(e => e.al.forEach(a => porAlias.set(a.t, e)));
    const out = [], vistos = new Set();
    terms.forEach(t => {
      const es = [...new Set([t.termino, t.nombre, ...t.es].map(N).filter(ok))], en = [...new Set(t.en.map(N).filter(ok))].filter(x => !es.includes(x));
      const todos = [...es, ...en]; if(!todos.length) return;
      const e = todos.map(x => porAlias.get(x)).find(Boolean) || dict.find(d => d.id === N(t.nombre));
      if(e){
        const tiene = new Set(e.al.map(a => a.t));
        const nes = es.filter(x => !tiene.has(x)), nen = en.filter(x => !tiene.has(x));
        if(!nes.length && !nen.length) return;
        const k = "s:" + e.id; if(vistos.has(k)) return; vistos.add(k);
        out.push({tipo: "sinonimos", l: e.l, c: e.c, al: nes, en: nen, prioridad: t.prioridad});
      } else {
        const k = "n:" + N(t.nombre); if(vistos.has(k)) return; vistos.add(k);
        out.push({tipo: "nuevo", l: t.nombre, c: t.categoria, al: es.filter(x => x !== N(t.nombre)), en, prioridad: t.prioridad});
      }
    });
    return out.slice(0, 40);
  }

"""

    if(malos.length) recs.splice(recs.length - 1, 0, `Archivo: ${malos.map(x => x.t.split(":")[0].toLowerCase()).join("; ")}. Para postular, conviene un PDF con texto o un .docx de una sola columna, sin tablas ni cuadros de texto.`);
    return `${cabPrint("Match aviso + CV")}
    <div class="card"><div class="score">
      <div class="big s-${nv}">${M.score}%</div>
      <div style="flex:1"><div class="lbl s-${nv}">Match ${nivelTxt(M.score)}</div>
        <div class="sm mut">Excluyentes y requisitos cubiertos: <b>${M.exc.ok} de ${M.exc.tot}</b> · Términos: ${M.cnt.ex} exactos, ${M.cnt.sin} sinónimos, ${M.cnt.fal} faltan${M.kws.length ? ` · Repetidos: ${M.kws.filter(k => k.ok).length} de ${M.kws.length}` : ""}</div>
        <div class="meter"><i class="b-${nv}" style="width:${M.score}%"></i></div></div>
    </div>
    <p class="sm mut" style="margin:10px 0 0">Estimación del motor local por reglas: pondera excluyentes ×3, requisitos ×2,5, responsabilidades ×1,5 y deseables ×1. Un sinónimo vale 75% de una coincidencia exacta.</p></div>
    ${M.skills.length ? `<div class="card"><h2>Términos del aviso en tu CV</h2><table class="t"><thead><tr><th>Prioridad</th><th>Término</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>` : ""}
    ${M.kws.length ? `<div class="card"><h2>Términos repetidos del aviso</h2><div class="chips">${M.kws.map(k => `<span class="chip ${k.ok ? "ok" : "no"}">${k.ok ? "✓" : "✗"} ${esc(k.t)}</span>`).join("")}</div></div>` : ""}
    ${M.req.length ? `<div class="card"><h2>Requisitos del puesto</h2><ul class="chk">${M.req.map(li).join("")}</ul></div>` : ""}
    <div class="card"><h2>Formato apto ATS</h2>${fc.length ? `<h3>Archivo: ${esc(S.cvSrc.nombre)} (${esc(S.cvSrc.tipo)})</h3><ul class="chk">${fc.map(li).join("")}</ul><h3>Contenido</h3>` : ""}<ul class="chk">${M.fmt.map(li).join("")}</ul>
      ${fc.length ? "" : '<p class="sm mut" style="margin:8px 0 0">Se revisa el texto pegado. Importá el PDF o el .docx para revisar también tablas, columnas, cuadros de texto e imágenes del archivo.</p>'}</div>
    <div class="card"><h2>Sugerencias</h2><ul class="recs">${recs.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      <div class="acts noprint"><button class="btn" data-act="csvMatch" type="button">⬇ CSV</button><button class="btn" data-act="print" type="button">🖨 Imprimir / PDF</button></div></div>
    ${M.skills.length ? `<div class="card noprint"><details><summary>📝 Tu CV resaltado con los términos del aviso</summary>
      <div class="leg"><span class="chip"><mark class="hl-ok">Igual que en el aviso</mark></span><span class="chip"><mark class="hl-syn">Sinónimo</mark></span><span class="chip"><mark class="hl-kw">Término repetido del aviso</mark></span></div>
      <div class="hltx">${cvResaltado(M) ?? esc(S.cv)}</div>
      ${M.cnt.fal ? `<p class="sm mut" style="margin:8px 0 0">No aparecen: ${esc(M.skills.filter(x => x.st === "falta").map(x => x.mainTxt).join(", "))}.</p>` : ""}</details></div>` : ""}
    <div id="carta">${htmlCarta()}</div>
    <div id="iaMatch">${htmlIAMatch(M)}</div>`;
  }

  // ----- Resaltado -----
  const entrada = id => DICT.find(e => e.id === id);
  const PRI_TXT = {exc: "Excluyente", req: "Requisito", resp: "Tarea", des: "Deseable", otro: "General"};
  function avisoResaltado(J){
    const specs = [];
    J.skills.forEach(s => { const e = entrada(s.id); if(e) Object.keys(s.al).forEach(t => { const a = e.re.find(x => x.t === t); if(a) specs.push({re: a.re, cls: "hl-" + (PRI_TXT[s.pri] ? s.pri : "otro"), tip: `${s.l} · ${PRI_TXT[s.pri] || "General"}`}); }); });
    return A.resaltar(S.aviso.texto, specs);
  }
  function cvResaltado(M){
    const specs = [];
    M.skills.forEach(s => { const e = entrada(s.id); if(e) e.re.forEach(a => specs.push({re: a.re, cls: Object.keys(s.al).includes(a.t) ? "hl-ok" : "hl-syn", tip: `${s.l} · ${PRI_TXT[s.pri] || "General"} · ${Object.keys(s.al).includes(a.t) ? "igual que en el aviso" : "sinónimo: el aviso dice “" + s.mainTxt + "”"}`})); });
    M.kws.filter(k => k.ok).forEach(k => specs.push({re: A.reTerm(A.norm(k.t)), cls: "hl-kw", tip: "Término que el aviso repite"}));
    return A.resaltar(S.cv, specs);
  }

  // ----- Carta de presentación -----
  let cartaOcupada = false;
  const cartaOpts = () => Object.assign({tono: "formal", largo: "media", idioma: "auto"}, S.cartaOpts || {});
  function htmlCarta(){
    const e = histActual(), c = e && e.carta, o = cartaOpts();
    const sel = (id, v, ops) => `<select id="${id}">${ops.map(([k, l]) => `<option value="${k}"${v === k ? " selected" : ""}>${l}</option>`).join("")}</select>`;
    return `<div class="card noprint"><h2>✉️ Carta de presentación</h2>
      <p class="sm mut">Borrador para el email o la carta de postulación. El motor local usa solo términos que aparecen en tu CV. La IA redacta mejor, pero envía el aviso y tu CV a ${esc(IA.quien())}.</p>
      <div class="g3" style="grid-template-columns:1fr 1fr 1fr"><label>Tono${sel("cTono", o.tono, [["formal", "Formal"], ["cercano", "Cercano"]])}</label>
        <label>Largo${sel("cLargo", o.largo, [["breve", "Breve"], ["media", "Media"]])}</label>
        <label>Idioma${sel("cIdioma", o.idioma, [["auto", "Como el aviso"], ["es", "Español"], ["en", "Inglés"]])}</label></div>
      <div class="acts"><button class="btn" data-act="cartaLocal" type="button">📝 Generar (motor local)</button>${IA.lista() ? `<button class="btn pri" data-act="cartaIA" type="button"${cartaOcupada ? " disabled" : ""}>${cartaOcupada ? '<span class="spin"></span> Redactando…' : "🤖 Generar con IA"}</button>` : ""}</div>
      ${c ? `<label class="mt">Borrador ${c.origen === "ia" ? "de la IA" : "del motor local"} · ${fmtD(c.at)} (podés editarlo)<textarea id="cartaTx" rows="14">${esc(c.texto)}</textarea></label>
        <div class="acts"><button class="btn" data-act="cartaCopiar" type="button">📋 Copiar</button><button class="btn" data-act="cartaTxt" type="button">⬇ .txt</button></div>
        <p class="sm mut">Revisala antes de enviarla: completá lo que falte y sacá lo que no sea exacto.</p>` : ""}
    </div>`;
  }
  function leerOpts(){ const o = {tono: $("#cTono").value, largo: $("#cLargo").value, idioma: $("#cIdioma").value}; S.cartaOpts = o; save(); return o; }
  const idiomaCarta = o => o.idioma !== "auto" ? o.idioma : (JOB && JOB.lang.cod === "en" ? "en" : "es");
  const listaY = (arr, en) => arr.length <= 1 ? (arr[0] || "") : arr.slice(0, -1).join(", ") + (en ? " and " : " y ") + arr[arr.length - 1];
  function cartaLocal(o){
    const M = MATCH, en = idiomaCarta(o) === "en";
    const puesto = S.aviso.puesto.trim() || (en ? "the position" : "la posición"), emp = S.aviso.empresa.trim();
    const l1 = (S.cv.split("\n").map(x => x.trim()).find(Boolean) || "");
    const nombre = /^[\p{L} .'-]{3,60}$/u.test(l1) && l1.split(/\s+/).length <= 5 ? l1 : (en ? "[Your name]" : "[Tu nombre]");
    const ok = M.skills.filter(x => x.st !== "falta");
    // En español se usa el nombre del término (“Análisis funcional”); en inglés, el término tal como lo escribe el aviso
    const nom = x => en ? x.mainTxt : x.l;
    const fuertes = ok.filter(x => x.pri === "exc" || x.pri === "req").map(nom).slice(0, 4);
    const tareas = ok.filter(x => x.pri === "resp").map(nom).slice(0, 4);
    const deseables = ok.filter(x => x.pri === "des").map(nom).slice(0, 3);
    const anios = Math.max(M.yrs.fechas, M.yrs.declarados);
    const cerca = o.tono === "cercano", largo = o.largo === "media";
    let t;
    if(en){
      t = [`Subject: Application – ${puesto}`, "", cerca ? `Hi ${emp ? emp + " team" : "there"},` : `Dear Hiring Team${emp ? " at " + emp : ""},`, "",
        `I am writing to apply for the ${puesto} position${emp ? " at " + emp : ""}.${anios ? ` I bring ${anios} years of professional experience` : " I bring relevant professional experience"}${fuertes.length ? `, including hands-on work with ${listaY(fuertes, true)}` : ""}.`];
      if(largo && tareas.length) t.push("", `In my recent roles I have worked with ${listaY(tareas, true)}, in line with the responsibilities described in your posting.`);
      if(deseables.length) t.push("", `I also have experience with ${listaY(deseables, true)}.`);
      t.push("", largo ? "I would welcome the opportunity to discuss how my background can contribute to your team. Thank you for your time and consideration." : "I would be glad to talk further about how I can contribute.", "", cerca ? "Best regards," : "Sincerely,", nombre);
    } else {
      t = [`Asunto: Postulación – ${puesto}`, "", cerca ? `Hola${emp ? ", equipo de " + emp : ""}:` : `Estimado equipo de selección${emp ? " de " + emp : ""}:`, "",
        `Les escribo para postularme a la búsqueda de ${puesto}.${anios ? ` Cuento con ${anios} años de experiencia profesional` : " Cuento con experiencia profesional en el área"}${fuertes.length ? `, con experiencia concreta en ${listaY(fuertes)}` : ""}.`];
      if(largo && tareas.length) t.push("", `En mis últimos roles trabajé con ${listaY(tareas)}, en línea con las tareas que describe la búsqueda.`);
      if(deseables.length) t.push("", `Además, tengo experiencia en ${listaY(deseables)}.`);
      t.push("", largo ? "Me encantaría conversar sobre cómo puedo aportar al equipo. Les agradezco el tiempo y quedo a disposición para ampliar cualquier información." : "Quedo a disposición para conversar cuando les resulte conveniente.", "", cerca ? "¡Gracias y saludos!" : "Saludos cordiales,", nombre);
    }
    return t.join("\n");
  }
  function guardarCarta(texto, origen){ const e = histActual(); if(e){ e.carta = {texto, origen, at: Date.now()}; save(); } const b = $("#carta"); if(b) b.innerHTML = htmlCarta(); }
  function generarCarta(ia){
    if(!S.aviso.texto.trim() || !S.cv.trim()){ toast("Necesitás el aviso y tu CV."); return; }
    const o = leerOpts();
    if(!MATCH) comparar(true); else guardarHist();
    if(!ia){ guardarCarta(cartaLocal(o), "local"); toast("Borrador generado."); return; }
    enviarCV(async () => {
      cartaOcupada = true; $("#carta").innerHTML = htmlCarta();
      try{ const r = await IA.carta(S.aviso.texto, S.cv, {...o, idioma: idiomaCarta(o), puesto: S.aviso.puesto, empresa: S.aviso.empresa}); cartaOcupada = false; guardarCarta((r.asunto ? (idiomaCarta(o) === "en" ? "Subject: " : "Asunto: ") + r.asunto + "\n\n" : "") + r.texto, "ia"); }
      catch(err){ cartaOcupada = false; $("#carta").innerHTML = htmlCarta(); errorIA(err); }
    });
  }

  // ----- Postulaciones -----
  const ESTADOS = [["", "Sin estado"], ["parapostular", "Para postular"], ["postulado", "Postulado"], ["entrevista", "Entrevista"], ["prueba", "Prueba técnica"], ["oferta", "Oferta"], ["rechazado", "Rechazado"], ["descartado", "Descartado por mí"], ["sinrta", "Sin respuesta"]];
  const ESTN = Object.fromEntries(ESTADOS);
  const CANALES = ["", "LinkedIn", "Bumeran", "ZonaJobs", "Computrabajo", "Indeed", "Glassdoor", "Web de la empresa", "Consultora", "Referido", "Otro"];
  const estB = k => k ? `<span class="est e-${k}">${esc(ESTN[k] || k)}</span>` : "";
  const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const fmtF = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("es-AR", {day: "2-digit", month: "2-digit", year: "numeric"}) : "";
  const dias = iso => Math.round((new Date(iso + "T12:00:00") - new Date(hoyISO() + "T12:00:00")) / 864e5);
  function dlgPost(id){
    const e = S.history.find(x => x.id === id); if(!e) return;
    const p = Object.assign({estado: "", fecha: "", link: "", canal: "", contacto: "", prox: "", proxF: "", notas: "", tl: []}, e.post || {});
    dlg(`<h3>📋 Seguimiento</h3><p class="sm mut" style="margin:0"><b>${esc(e.puesto || "(sin título)")}</b>${e.empresa ? " · " + esc(e.empresa) : ""}</p>
      <div class="g2"><label>Estado<select id="pE">${ESTADOS.map(([k, l]) => `<option value="${k}"${p.estado === k ? " selected" : ""}>${l}</option>`).join("")}</select></label>
        <label>Fecha de postulación<input id="pF" type="date" value="${esc(p.fecha)}"></label>
        <label>Canal<select id="pC">${CANALES.map(c => `<option${p.canal === c ? " selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
        <label>Contacto<input id="pCo" value="${esc(p.contacto)}" placeholder="Nombre, email o teléfono"></label></div>
      <label>Link del aviso<input id="pL" type="url" value="${esc(p.link)}" placeholder="https://…"></label>
      <div class="g2"><label>Próximo paso<input id="pP" value="${esc(p.prox)}" placeholder="Ej. hacer seguimiento por email"></label><label>Fecha del próximo paso<input id="pPF" type="date" value="${esc(p.proxF)}"></label></div>
      <label>Notas<textarea id="pN" rows="3">${esc(p.notas)}</textarea></label>
      ${p.tl.length ? `<ul class="tl">${p.tl.slice().reverse().map(x => `<li>${fmtD(x.at)} · ${esc(ESTN[x.estado] || "Sin estado")}</li>`).join("")}</ul>` : ""}
      <div class="acts"><button class="btn" data-x type="button">Cancelar</button><button class="btn pri" id="pOk" type="button">Guardar</button></div>`);
    $("#pE").onchange = () => { if(["postulado"].includes($("#pE").value) && !$("#pF").value) $("#pF").value = hoyISO(); };
    $("#pOk").onclick = () => {
      const n = {estado: $("#pE").value, fecha: $("#pF").value, canal: $("#pC").value, contacto: $("#pCo").value.trim().slice(0, 200), link: $("#pL").value.trim().slice(0, 500),
        prox: $("#pP").value.trim().slice(0, 200), proxF: $("#pPF").value, notas: $("#pN").value.slice(0, 4000), tl: p.tl.slice(-30)};
      if(n.estado !== p.estado) n.tl.push({estado: n.estado, at: Date.now()});
      e.post = n; save(); $("#dlg").close(); if(S.tab === "hist") vHist(); toast("Seguimiento guardado.");
    };
  }

  // ----- Tendencias -----
  const cacheT = new Map();
  function datosAviso(e){
    const k = e.h + "|" + S.reglas.ver; if(cacheT.has(k)) return cacheT.get(k);
    const J = A.analyzeJob(e.texto || "", {dict: DICT});
    const d = {skills: J.skills.map(s => ({id: s.id, l: s.l, c: s.c, req: s.pri === "exc" || s.pri === "req"})), seniority: J.seniority, modalidad: J.modalidad, years: J.years, ingles: J.idiomas.some(i => i.n === "Inglés")};
    cacheT.set(k, d); return d;
  }
  let tendF = {per: "0", post: false};
  function vTend(){
    const lim = +tendF.per ? Date.now() - +tendF.per * 864e5 : 0;
    const E = S.history.filter(e => (e.upd || e.at) >= lim && (!tendF.post || (e.post && ["postulado", "entrevista", "prueba", "oferta", "rechazado", "sinrta"].includes(e.post.estado))));
    const filtros = `<div class="g2 noprint"><label>Período<select id="tPer">${[["0", "Todo"], ["30", "Últimos 30 días"], ["90", "Últimos 90 días"], ["365", "Último año"]].map(([k, l]) => `<option value="${k}"${tendF.per === k ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <label style="flex-direction:row;align-items:center;gap:8px;color:var(--tx);margin-top:18px"><input type="checkbox" id="tPost" style="width:18px;height:18px"${tendF.post ? " checked" : ""}> Solo avisos a los que me postulé</label></div>`;
    const bind = () => { const a = $("#tPer"), b = $("#tPost"); if(a) a.onchange = () => { tendF.per = a.value; vTend(); }; if(b) b.onchange = () => { tendF.post = b.checked; vTend(); }; };
    if(E.length < 2){ main.innerHTML = `<div class="card"><h2>📈 Tendencias</h2>${filtros}<p class="mut">Hacen falta al menos 2 avisos analizados${tendF.post || +tendF.per ? " con estos filtros" : ""} para ver tendencias. Cada aviso que analizás se suma automáticamente.</p></div>`; bind(); return; }
    const D = E.map(datosAviso), N = E.length;
    const cvN = A.norm(S.cv || ""), hayCV = !!cvN.trim();
    const cnt = new Map(), cats = {}, sen = {}, mod = {};
    D.forEach(d => {
      d.skills.forEach(s => { const x = cnt.get(s.id) || {l: s.l, c: s.c, n: 0, r: 0}; x.n++; if(s.req) x.r++; cnt.set(s.id, x); cats[s.c] = (cats[s.c] || 0) + 1; });
      (d.seniority.length ? d.seniority : ["No indica"]).forEach(x => sen[x] = (sen[x] || 0) + 1);
      (d.modalidad.length ? d.modalidad : ["No indica"]).forEach(x => mod[x] = (mod[x] || 0) + 1);
    });
    const top = [...cnt.entries()].map(([id, x]) => ({id, ...x, falta: hayCV && !A.cvTiene(cvN, entrada(id))})).sort((a, b) => b.n - a.n || b.r - a.r).slice(0, 20);
    const yrs = D.map(d => d.years).filter(Boolean), sc = E.map(e => e.score).filter(x => typeof x === "number");
    const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length * 10) / 10 : null;
    const pct = n => Math.round(n / N * 100);
    const bars = (rows, extra) => `<div class="bars">${rows.map(r => `<div class="bar" title="${esc(r.tip || "")}"><span class="bl">${esc(r.l)}${extra ? extra(r) : ""}</span><span class="bt"><i style="width:${Math.max(2, r.p)}%"></i></span><span class="bv">${r.v}</span></div>`).join("")}</div>`;
    const dist = o => bars(Object.entries(o).sort((a, b) => b[1] - a[1]).map(([l, n]) => ({l, p: pct(n), v: pct(n) + "%", tip: `${n} de ${N} avisos`})));
    const reforzar = top.filter(x => x.falta && x.n >= Math.max(2, Math.ceil(N * .2)));
    main.innerHTML = `${cabPrint("Tendencias")}<div class="card"><h2>📈 Tendencias de tus avisos</h2>${filtros}
      <div class="tiles"><div class="tile"><b>${N}</b><span>avisos analizados</span></div><div class="tile"><b>${sc.length ? avg(sc) + "%" : "—"}</b><span>match promedio${sc.length ? ` (${sc.length})` : ""}</span></div>
        <div class="tile"><b>${pct(D.filter(d => d.ingles).length)}%</b><span>piden inglés</span></div><div class="tile"><b>${yrs.length ? avg(yrs) : "—"}</b><span>años de experiencia pedidos (prom.)</span></div></div></div>
    ${reforzar.length ? `<div class="card"><h2>🎯 Para reforzar en tu CV</h2><p class="sm mut">Se piden seguido y no aparecen en tu CV. Si los tenés, sumalos con estas palabras; si no, son candidatos para aprender.</p>
      ${bars(reforzar.map(x => ({l: x.l, p: pct(x.n), v: pct(x.n) + "%", tip: `${x.n} de ${N} avisos · ${x.r} como requisito`})))}</div>` : ""}
    <div class="card"><h2>Términos más pedidos</h2><p class="sm mut">Porcentaje de avisos que los mencionan.${hayCV ? " <span class='falta'>falta</span> = no está en tu CV." : ""} Pasá el mouse (o tocá) una barra para ver el detalle.</p>
      ${bars(top.map(x => ({...x, p: pct(x.n), v: pct(x.n) + "%", tip: `${x.n} de ${N} avisos · ${x.r} como excluyente o requisito · ${A.CATS[x.c]}`})), r => r.falta ? '<span class="falta">falta</span>' : "")}
      <details class="mt"><summary>Ver como tabla</summary><table class="t"><thead><tr><th>Término</th><th>Avisos</th><th>Como requisito</th>${hayCV ? "<th>En tu CV</th>" : ""}</tr></thead>
        <tbody>${top.map(x => `<tr><td>${esc(x.l)}</td><td>${x.n} (${pct(x.n)}%)</td><td>${x.r}</td>${hayCV ? `<td>${x.falta ? "No" : "Sí"}</td>` : ""}</tr>`).join("")}</tbody></table></details></div>
    <div class="card"><h2>Por categoría</h2><p class="sm mut">Porcentaje de menciones.</p>${(() => { const tot = Object.values(cats).reduce((a, b) => a + b, 0) || 1; return bars(Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, n]) => ({l: A.CATS[c], p: Math.round(n / tot * 100), v: Math.round(n / tot * 100) + "%", tip: `${n} menciones`}))); })()}</div>
    <div class="card"><h2>Seniority</h2>${dist(sen)}<h3 class="mt">Modalidad</h3>${dist(mod)}
      <div class="acts noprint"><button class="btn" data-act="csvTend" type="button">⬇ CSV</button><button class="btn" data-act="print" type="button">🖨 Imprimir / PDF</button></div></div>`;
    bind();
    TEND = {N, top};
  }
  let TEND = null;

  // ----- IA -----
  const histActual = () => { const t = S.aviso.texto.trim(); return t ? S.history.find(x => x.h === hash(t)) : null; };
  const SUG = {aviso: [], match: []};
  let iaOcupado = "";

  function guardarHist(score){
    const t = S.aviso.texto.trim(), h = hash(t);
    let e = S.history.find(x => x.h === h);
    const J = JOB;
    const res = {skills: J.skills.length, exc: J.skills.filter(s => s.pri === "exc" || s.pri === "req").length, seniority: J.seniority, modalidad: J.modalidad,
      top: J.skills.filter(s => s.pri === "exc" || s.pri === "req").slice(0, 8).map(s => s.l)};
    if(!e){ e = {id: uid(), h, at: Date.now()}; S.history.unshift(e); }
    Object.assign(e, {upd: Date.now(), puesto: S.aviso.puesto, empresa: S.aviso.empresa, texto: t, res});
    if(score !== undefined){ e.score = score; e.scoreAt = Date.now(); }
    S.history.sort((a, b) => (b.upd || b.at) - (a.upd || a.at));
    if(S.history.length > 300) S.history.length = 300;
    save();

      dlg(`<h3>Importar backup</h3><p>El archivo trae <b>${d.history.length}</b> avisos, <b>${d.custom.length}</b> términos propios${d.cv ? " y un CV" : ""}${o.exportado ? ` (exportado el ${esc(fmtD(o.exportado))})` : ""}.</p>

    privacidad: () => dlg(`<h3>Privacidad y datos</h3>
      <p>Todo se procesa y se guarda <b>solo en este navegador</b>: avisos, historial, tu CV y tus términos propios. Nada se sube al repositorio ni a otro servidor.</p>
      <p class="sm mut">Los archivos que importás (PDF, .docx, JSON) se leen en tu dispositivo y solo se guarda el texto extraído. Para leer PDF se descarga una vez la librería pdf.js desde un CDN público (no recibe tu archivo). Con “Documento de Google” la app pide el documento directamente a Google.</p>
      <p class="sm mut">La IA es opcional: solo se usa cuando tocás “Analizar con IA” o “Comparar con IA”, y envía el aviso (y tu CV, en el match) al proveedor que configuraste. La clave de API y el token quedan aparte y no se incluyen en el backup.</p>
      <p class="sm mut">Si borrás los datos del navegador, se pierden: usá “Exportar backup” para tener una copia. El backup incluye tu CV, así que guardalo en un lugar privado.</p>
      <div class="acts"><button class="btn pri" data-x type="button">Entendido</button></div>`),
    borrarTodo: () => confirmar("Borrar todos los datos", "Se borran el aviso, el CV, el historial, los términos propios y la configuración de IA de este navegador. No se puede deshacer.", "Borrar todo", () => { const tema = S.tema; S = nuevo(); S.tema = tema; try{ localStorage.removeItem("jobpost_ia_v1"); }catch(e){} JOB = MATCH = null; rebuild(); save(); render(); toast("Datos borrados."); })
  };
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if(!b || !ACT[b.dataset.act]) return;
    e.preventDefault(); ACT[b.dataset.act](b);
  });

  let tt;
  function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }

  render();
})();
</script>
<!-- ===== Versión (estándar caja de apps) — bloque autónomo =====
     Requiere en el <head>: <meta name="app-version" content="vX.Y.Z">
     y en el encabezado: <button id="verBtn" class="vs-ver" type="button">v—</button>
     (o, si la app ya muestra su propio texto de versión, marcar ese elemento con data-vs-open:
      al tocarlo abre el diálogo y no se le cambia el texto).
     1) El número escrito en el HTML se ve siempre (sin conexión, Apps Script, caché vieja).
     2) Fecha y Changelog desde las Releases de GitHub (sin conexión: última copia guardada).
     3) Si GitHub tiene una versión más alta: aviso "Hay una versión nueva, recargá". -->
<style>
  .vs-ver{border:1px solid #d0d5dd;background:#fff;color:#555;font:600 12px system-ui,sans-serif;padding:3px 10px;border-radius:999px;cursor:pointer;vertical-align:middle}
  .vs-ver.new,[data-vs-open].new{border-color:#d97706;color:#d97706}
  [data-vs-open]{cursor:pointer}
  .vs-upd{display:none;position:sticky;top:0;z-index:9998;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:#f59e0b;color:#1c1f26;font:14px system-ui,sans-serif}
  .vs-upd.on{display:flex}
  .vs-upd button,.vs-dlg .vs-acts button,.vs-dlg .vs-acts a{border:1px solid #c9ced6;border-radius:10px;padding:8px 13px;background:#fff;color:#1c1f26;font:14px system-ui,sans-serif;cursor:pointer;text-decoration:none}
  .vs-upd button{border-color:#1c1f26;background:#1c1f26;color:#fff}
  .vs-dlg{border:1px solid #d0d5dd;border-radius:16px;padding:20px;max-width:min(560px,92vw);width:100%;font:15px/1.45 system-ui,sans-serif;color:#1c1f26;background:#fff}
  .vs-dlg h3{margin:0 0 8px}.vs-dlg .vs-mut{color:#6b7280}
  .vs-dlg .vs-rels{max-height:60vh;overflow:auto}
  .vs-dlg .vs-rel{border-top:1px solid #e5e7eb;padding:10px 0}.vs-dlg .vs-rel pre{white-space:pre-wrap;font:inherit;font-size:14px;color:#6b7280;margin:4px 0 0}
  .vs-dlg .vs-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
  @media print{.vs-ver,.vs-upd,.vs-dlg{display:none!important}}
  .vs-dlg .vs-acts .vs-pri{background:#0f766e;border-color:#0f766e;color:#fff}
</style>
<div class="vs-upd" id="vsUpd" role="status"><span id="vsUpdTxt">Hay una versión nueva, recargá.</span><button type="button" id="vsUpdBtn">Recargar</button></div>
<dialog class="vs-dlg" id="vsDlg"></dialog>
<script>
(function(){
  const REPO = "luchorcompartidos/jobpost";                       // usuario/repo de GitHub
  const LOG_FN = "";                   // función propia de Changelog de la app (vacío = usar el de GitHub)
  const KEY  = "vs_rels_" + REPO;
  const APP_VERSION = (document.querySelector('meta[name="app-version"]')||{}).content || "v—";
  const $ = id => document.getElementById(id);
  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = s => new Date(s).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const semv = t => (String(t).replace(/^v/,"").split(".").map(n=>parseInt(n)||0).concat([0,0,0])).slice(0,3);
  const cmpV = (a,b) => { const x=semv(a), y=semv(b); for(let i=0;i<3;i++) if(x[i]!==y[i]) return y[i]-x[i]; return 0; };
  let rels = null; try{ rels = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  // Estado de la última consulta a GitHub: así el diálogo distingue "no está publicada" de "no se pudo consultar"
  let relsAt = 0; try{ relsAt = +localStorage.getItem(KEY+"_t") || 0; }catch(e){}
  let lastFail = false, loading = null;
  // Si el diálogo quedó fuera del <body> (bloque pegado al final), lo movemos
  [$("vsUpd"),$("vsDlg")].forEach(el=>{ if(el && el.parentNode!==document.body) document.body.appendChild(el); });
  document.body.insertBefore($("vsUpd"), document.body.firstChild);
  // Dentro de Apps Script la app sale de la copia del script: recargar no alcanza, hay que actualizarlo.
  const GAS = !!(window.google && window.google.script && window.google.script.run);
  const REL_URL = `https://github.com/${REPO}/releases`;
  if(GAS){ const ub=$("vsUpdBtn"); ub.textContent = "Ver Releases"; }
  const ultima = () => rels && rels[0];
  const hayNueva = () => !!(ultima() && APP_VERSION!=="v—" && cmpV(ultima().tag, APP_VERSION) < 0);
  function show(){
    const b = $("verBtn"), n = hayNueva();
    if(b){ b.textContent = APP_VERSION + (n?" ⬆":""); b.classList.toggle("new", n); b.title = n ? "Hay una versión nueva: "+ultima().tag : "Versión"; }
    document.querySelectorAll("[data-vs-open]").forEach(el=>{ el.classList.toggle("new", n); if(n) el.title = "Hay una versión nueva: "+ultima().tag; });
    $("vsUpd").classList.toggle("on", n);
    if(n) $("vsUpdTxt").textContent = GAS ? `Hay una versión nueva (${ultima().tag}): actualizá el script de Apps Script.`
                                          : `Hay una versión nueva (${ultima().tag}), recargá.`;
  }
  function load(){ if(!loading) loading = doLoad().finally(()=>{ loading = null; }); return loading; }
  async function doLoad(){
    try{
      const r = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});
      if(!r.ok){ lastFail = true; return; }
      lastFail = false; relsAt = Date.now(); try{ localStorage.setItem(KEY+"_t", String(relsAt)); }catch(e){}
      rels = (await r.json()).filter(x=>!x.draft && !x.prerelease).map(x=>{
        const f = (x.assets||[]).map(a=>a.updated_at).filter(Boolean).sort();
        return { tag:x.tag_name, date:f.length?f[f.length-1]:(x.published_at||x.created_at), deArchivo:f.length>0, body:x.body||"" };
      }).sort((a,b)=>cmpV(a.tag,b.tag));
      try{ localStorage.setItem(KEY, JSON.stringify(rels)); }catch(e){}
      show();
    }catch(e){ lastFail = true; }
  }
  function recargar(){ if(GAS){ window.open(REL_URL, "_blank", "noopener"); return; } const u = new URL(location.href); u.searchParams.set("v", Date.now()); location.replace(u); }
  function dlg(html){
    const d = $("vsDlg"); d.innerHTML = html;
    d.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>d.close());
    if(!d.open) d.showModal(); return d;
  }
  let reintento = false;
  function openVer(){
    const r = (rels||[]).find(x=>x.tag===APP_VERSION), n = hayNueva();
    const hace = relsAt ? ` (información de hace ${Math.max(1, Math.round((Date.now()-relsAt)/60000))} min)` : "";
    // Si la lista guardada no tiene esta versión, se vuelve a consultar GitHub antes de concluir nada
    if(!r && !reintento && navigator.onLine !== false){ reintento = true; dlg(`<h3>Versión ${esc(APP_VERSION)}</h3><p class="vs-mut">Consultando GitHub…</p>`); load().then(()=>{ if($("vsDlg").open) openVer(); reintento = false; }); return; }
    const fecha = r ? (r.deArchivo?"Archivos actualizados el ":"Publicada el ")+"<b>"+fmt(r.date)+"</b>"
                    : navigator.onLine === false ? `Sin conexión: no se puede consultar GitHub ahora${rels ? hace : ""}.`
                    : lastFail ? `No se pudo consultar GitHub (puede ser un límite de consultas seguidas). Probá de nuevo en unos minutos${rels ? hace : ""}.`
                    : rels ? "Esta versión todavía no figura en las Releases de GitHub. Se publica unos segundos después de cada entrega: probá de nuevo en un minuto."
                    : "Fecha no disponible (requiere conexión).";
    const d = dlg(`<h3>Versión ${esc(APP_VERSION)}</h3><p class="vs-mut">${fecha}</p>${n?`<p><b>Hay una versión nueva: ${esc(ultima().tag)}.</b>${GAS?" Para usarla, actualizá el script de Apps Script.":""}</p>`:""}
      <div class="vs-acts">${n?`<button class="vs-pri" id="vsRec" type="button">${GAS?"Ver Releases":"↻ Recargar"}</button>`:""}<button ${n?"":'class="vs-pri"'} id="vsLog" type="button">📋 Changelog</button><button data-x type="button">Cerrar</button></div>`);
    d.querySelector("#vsLog").onclick = () => { if(LOG_FN && typeof window[LOG_FN]==="function"){ d.close(); window[LOG_FN](); } else openLog(); };
    const rb = d.querySelector("#vsRec"); if(rb) rb.onclick = recargar;
  }
  function openLog(){
    const list = (rels||[]).map(r=>`<div class="vs-rel"><b>${esc(r.tag)}</b>${r.tag===APP_VERSION?' <span class="vs-mut">(la que estás usando)</span>':""} · <span class="vs-mut">${fmt(r.date)}</span>${r.body?`<pre>${esc(r.body)}</pre>`:""}</div>`).join("");
    dlg(`<h3>Changelog</h3><div class="vs-rels">${list||'<p class="vs-mut">Sin datos todavía (requiere conexión).</p>'}</div>
      <div class="vs-acts"><a href="${REL_URL}" target="_blank" rel="noopener">Ver Releases en GitHub ↗</a><button data-x type="button">Cerrar</button></div>`);
  }
  $("vsDlg").addEventListener("click", e=>{ if(e.target.id==="vsDlg") e.target.close(); });
  if($("verBtn")) $("verBtn").addEventListener("click", openVer);
  document.querySelectorAll("[data-vs-open]").forEach(el=>el.addEventListener("click", openVer));
  window.VS = { abrir: openVer, version: APP_VERSION, hayNueva };
  $("vsUpdBtn").addEventListener("click", recargar);
  show(); load();
  // Se vuelve a consultar al volver a la app, si la información tiene más de 10 minutos
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && Date.now()-relsAt > 600000) load(); });
  window.addEventListener("online", ()=>load());
})();
</script>
<!-- ===== fin bloque Versión ===== -->
</body>
</html>
