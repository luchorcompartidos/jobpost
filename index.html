<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="v0.0.1">
<meta name="theme-color" content="#0f766e">
<title>Job Post ATS Analizer</title>
<style>
  :root{--bg:#f3f6f6;--card:#fff;--tx:#1c1f26;--mut:#6b7280;--bd:#e2e8ea;--ac:#0f766e;--ac2:#e6f4f2;--ok:#15803d;--okb:#dcfce7;--mid:#b45309;--midb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--r:14px}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--bd)}
  .hd{display:flex;align-items:center;gap:10px;max-width:820px;margin:0 auto;padding:10px 14px 6px}
  .hd h1{margin:0;font-size:19px}
  .sp{flex:1}
  nav{display:flex;max-width:820px;margin:0 auto;padding:0 8px}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap;border:0;background:none;padding:6px 2px 8px;font:600 13px system-ui,sans-serif;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer}
  nav button.on{color:var(--ac);border-bottom-color:var(--ac)}
  main{max-width:820px;margin:0 auto;padding:14px 12px 80px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
  h2{font-size:16px;margin:0 0 8px}
  h3{font-size:13px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
  h3:first-child{margin-top:0}
  .mut{color:var(--mut)} .sm{font-size:13px} .warn{color:var(--mid)}
  a{color:var(--ac)}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .btn{border:1px solid #c9ced6;border-radius:10px;padding:8px 13px;background:#fff;color:var(--tx);font:14px system-ui,sans-serif;cursor:pointer}
  .btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
  .btn.danger{color:var(--bad);border-color:#f3c4c4}
  .btn.xs{padding:4px 9px;font-size:13px;border-radius:8px}
  .ic{border:0;background:none;font-size:18px;padding:6px;cursor:pointer;color:var(--mut);border-radius:8px;line-height:1}
  .ic:hover{background:var(--bg)}
  input,select,textarea{font:15px system-ui,sans-serif;color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:7px 9px;background:#fff;min-width:0;width:100%}
  textarea{resize:vertical;line-height:1.4}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--ac2);border-color:var(--ac)}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g3{display:grid;grid-template-columns:1.2fr 1.6fr 1fr auto;gap:8px;align-items:end}
  .mt{margin-top:10px}
  /* Resumen */
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
  .kv dt{color:var(--mut)} .kv dd{margin:0}
  /* Chips */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;background:#f1f5f9;color:#334155;border:1px solid transparent}
  .chip b{font-weight:700;opacity:.7}
  .chip button{border:0;background:none;padding:0 0 0 2px;font:700 14px system-ui;cursor:pointer;color:inherit}
  .c-L{background:#dbeafe;color:#1e40af}.c-D{background:#dcfce7;color:#166534}.c-C{background:#e0f2fe;color:#075985}
  .c-H{background:#f3e8ff;color:#6b21a8}.c-M{background:#fef3c7;color:#92400e}.c-A{background:#ccfbf1;color:#115e59}
  .c-Q{background:#fce7f3;color:#9d174d}.c-G{background:#ffedd5;color:#9a3412}.c-B{background:#f1f5f9;color:#334155}
  .c-X{background:#fee2e2;color:#991b1b}.c-I{background:#ede9fe;color:#5b21b6}.c-P{background:#e2e8f0;color:#0f172a;border-color:#94a3b8}
  .chip.ok{background:var(--okb);color:var(--ok)} .chip.no{background:var(--badb);color:var(--bad)} .chip.mid{background:var(--midb);color:var(--mid)}
  .pri-h{display:flex;align-items:baseline;gap:8px;margin:12px 0 6px;font-weight:700;font-size:14px}
  .pri-h small{font-weight:400;color:var(--mut)}
  .leg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .leg .chip{font-size:12px;padding:2px 8px}
  ul.recs{margin:4px 0 0;padding-left:20px} ul.recs li{margin:4px 0}
  /* Score */
  .score{display:flex;align-items:center;gap:16px}
  .score .big{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .score .lbl{font-weight:700}
  .meter{height:10px;border-radius:9px;background:#e5e7eb;overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;border-radius:9px}
  .s-ok{color:var(--ok)} .s-mid{color:var(--mid)} .s-bad{color:var(--bad)}
  .b-ok{background:var(--ok)} .b-mid{background:#d97706} .b-bad{background:var(--bad)}
  table.t{width:100%;border-collapse:collapse;font-size:14px}
  table.t th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:4px}
  table.t td{padding:7px 4px;border-top:1px solid var(--bd);vertical-align:top}
  table.t td small{display:block;color:var(--mut);font-size:12px}
  .st{font-weight:600;min-width:92px}
  table.t td{overflow-wrap:anywhere}
  @media (max-width:560px){ table.t{font-size:13px} table.t th:first-child,table.t td:first-child{width:28%} }
  ul.chk{list-style:none;margin:0;padding:0} ul.chk li{padding:5px 0;border-top:1px solid var(--bd);display:flex;gap:8px}
  ul.chk li:first-child{border-top:0}
  /* Historial / diccionario */
  .hrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd)}
  .hrow:first-of-type{border-top:0}
  .hrow .ht{flex:1;min-width:0}
  .hrow .ha{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
  .badge.ok{background:var(--okb);color:var(--ok)} .badge.mid{background:var(--midb);color:var(--mid)} .badge.bad{background:var(--badb);color:var(--bad)}
  /* Diálogo */
  .dlg{border:1px solid var(--bd);border-radius:16px;padding:18px;width:min(520px,94vw);color:var(--tx)}
  .dlg::backdrop{background:rgba(15,23,42,.35)}
  .dlg h3{margin:0 0 12px;color:var(--tx);text-transform:none;font-size:17px;letter-spacing:0}
  .dlg .acts{justify-content:flex-end}
  .menu .btn{width:100%;text-align:left;margin-bottom:8px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#1c1f26;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9999;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%)}
  .printonly{display:none}
  @media (max-width:560px){ .g2{grid-template-columns:1fr} .g3{grid-template-columns:1fr 1fr} .kv{grid-template-columns:118px 1fr} .score .big{font-size:38px} }
  @media (max-width:420px){ nav button{font-size:12px} }
  @media print{
    header,nav,.noprint,#toast{display:none!important}
    html,body{background:#fff}
    main{padding:0;max-width:none}
    .card{break-inside:avoid;border-color:#bbb}
    .printonly{display:block;margin:0 0 10px}
    .chip{border:1px solid #ccc}
  }
</style>
</head>

    <h1>🎯 Job Post ATS</h1>
    <button id="verBtn" class="vs-ver" type="button">v—</button>
    <span class="sp"></span>
    <button class="ic" id="menuBtn" type="button" title="Más opciones">⋯</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main"></main>
<dialog class="dlg" id="dlg"></dialog>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

    .replace(/[–—−]/g, "-").replace(/ /g, " ");
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&");
  const reTerm = t => new RegExp("(?<![a-z0-9])" + t.split(/[\s-]+/).map(escRe).join("[\\s-]+") + "(?![a-z0-9])", "g");

  function mkEntry(l, c, es, en, src){
    const seen = new Set(), al = [];
    const add = (t, isEn) => { t = norm(t).trim().replace(/\s+/g, " "); if(!t || seen.has(t)) return; seen.add(t); al.push({t, en: !!isEn}); };
    (en || []).forEach(t => add(t, true));
    add(l, false); (es || []).forEach(t => add(t, false));
    return {id: norm(l).trim(), l: String(l).trim(), c: CATS[c] ? c : "P", al, src};
  }
  const BASE = RAW.trim().split("\n").map(s => s.trim()).filter(s => s && !s.startsWith("#")).map(line => {
    const [l, c, al = ""] = line.split("|"); const [es = "", en = ""] = al.split(";");
    return mkEntry(l, c, es.split(","), en.split(","), "base");
  });

  // Diccionario = base + entradas propias (las propias con el mismo nombre suman sinónimos a la base)
  function buildDict(custom){
    const map = new Map();
    BASE.forEach(e => map.set(e.id, {...e, al: e.al.slice()}));
    (custom || []).forEach(c => {
      const e = mkEntry(c.l, c.c, c.al || [], c.en || [], c.src || "propio");
      const ex = map.get(e.id);
      if(ex){ const s = new Set(ex.al.map(a => a.t)); e.al.forEach(a => { if(!s.has(a.t)) ex.al.push(a); }); ex.ext = true; }
      else if(e.id) map.set(e.id, e);
    });
    const list = [...map.values()];
    list.forEach(e => { e.re = e.al.map(a => ({t: a.t, en: a.en, re: reTerm(a.t)})); });
    return list;
  }

  // ---------- Secciones del aviso ----------
  const PRI = {
    exc:  {n:"Excluyentes",       w:3,   o:6},
    req:  {n:"Requisitos",        w:2.5, o:5},
    resp: {n:"Responsabilidades", w:1.5, o:4},
    des:  {n:"Deseables",         w:1,   o:3},
    otro: {n:"Generales",         w:1,   o:2},
    ben:  {n:"En beneficios",     w:.5,  o:1},
    emp:  {n:"Sobre la empresa",  w:.5,  o:0}
  };

    let tot = 0, got = 0;

    const skillSc = tot ? got / tot : null;
    const kwSc = kws.length ? kws.filter(k => k.ok).length / kws.length : null;
    const score = Math.round(100 * (skillSc === null ? (kwSc ?? 0) : kwSc === null ? skillSc : .8 * skillSc + .2 * kwSc));
    const cvLines = cn.split("\n").map(n => ({n}));
    const yrs = cvYears(cn);
    const cvLangs = langs(cvLines);
    const cvEdu = any(cn, EDU);
    const words = (cn.match(/[a-z0-9]+/g) || []).length;
    const heads = s => cn.split("\n").some(l => { const c = l.trim().replace(/^[^a-z0-9]+/, "").replace(/:$/, ""); return c.length <= 40 && s.test(c); });
    const fmt = [
      {ok: /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/.test(cn), t: "Email de contacto"},
      {ok: /(\+?\d[\d\s().-]{7,}\d)/.test(cn), t: "Teléfono"},
      {ok: /linkedin/.test(cn), t: "Perfil de LinkedIn"},
      {ok: heads(/^(perfil|resumen|sobre mi|summary|profile|extracto|perfil profesional)\b/), t: "Sección de perfil o resumen"},
      {ok: heads(CV_EXP), t: "Sección “Experiencia” con título estándar"},
      {ok: heads(/^(educacion|formacion(?: academica)?|estudios|education)\b/), t: "Sección “Educación” o “Formación”"},
      {ok: heads(/^(habilidades|skills|conocimientos|competencias|aptitudes|herramientas|conocimientos tecnicos)\b/), t: "Sección de habilidades o conocimientos"},
      {ok: heads(/^(idiomas|languages)\b/), t: "Sección “Idiomas”"},
      {ok: yrs.rangos > 0, t: "Fechas de inicio y fin en las experiencias"},
      {ok: words >= 200 && words <= 1100, t: words < 200 ? `Largo: ${words} palabras (parece corto o incompleto)` : words > 1100 ? `Largo: ${words} palabras (más de 2 páginas aprox.)` : `Largo: ${words} palabras`},
      {ok: !cn.split("\n").some(l => (l.match(/\|/g) || []).length >= 3 || (l.match(/\t/g) || []).length >= 3), t: "Sin tablas ni columnas detectadas en el texto"}
    ];
    const pn = norm(puesto || "").replace(/\b(sr|ssr|jr|senior|semi senior|junior|ii|iii)\b/g, "").replace(/[^a-z0-9 ]/g, " ").trim().replace(/\s+/g, " ");
    const titulo = pn ? has(cn, pn) : null;
    const cvMax = Math.max(yrs.fechas, yrs.declarados);
    const req = [];
    if(J.years) req.push({ok: cvMax ? cvMax >= J.years : null, t: `Experiencia: pide ${J.years}+ años · tu CV ≈ ${cvMax ? cvMax + " años" : "no se pudo estimar"}${yrs.fechas && yrs.declarados ? ` (fechas ${yrs.fechas}, declarados ${yrs.declarados})` : yrs.fechas ? " (por fechas)" : yrs.declarados ? " (declarados)" : ""}`});
    J.idiomas.forEach(i => { const c = cvLangs.find(x => x.n === i.n); req.push({ok: c ? (i.lv ? (c.lv ? c.lv >= i.lv : null) : true) : false, t: `${i.n}: pide ${i.lv ? "nivel " + i.txt : "(sin nivel indicado)"} · tu CV: ${c ? (c.lv ? "nivel " + c.txt : "sin nivel indicado") : "no lo menciona"}`}); });
    if(J.educacion.length) req.push({ok: cvEdu.length ? true : null, t: `Educación: pide ${J.educacion.join(", ").toLowerCase()} · tu CV: ${cvEdu.length ? cvEdu.join(", ").toLowerCase() : "no se detectó"}`});
    if(titulo !== null) req.push({ok: titulo, t: `Título del puesto (“${puesto}”) ${titulo ? "aparece" : "no aparece"} en tu CV`});
    const M = {score, skillSc, kwSc, skills, kws, req, fmt, yrs,
      exc: {tot: skills.filter(s => s.pri === "exc" || s.pri === "req").length, ok: skills.filter(s => (s.pri === "exc" || s.pri === "req") && s.st !== "falta").length},
      cnt: {ex: skills.filter(s => s.st === "exacto").length, sin: skills.filter(s => s.st === "sinonimo").length, fal: skills.filter(s => s.st === "falta").length}};
    M.recs = recsMatch(M, J);
    return M;
  }
  function recsMatch(M, J){
    const r = [];
    const falta = M.skills.filter(s => s.st === "falta"), sin = M.skills.filter(s => s.st === "sinonimo");
    const fe = falta.filter(s => s.pri === "exc" || s.pri === "req");
    if(fe.length) r.push(`Requisitos que tu CV no menciona: ${lista(fe.map(s => s.mainTxt), 8)}. Si tenés esa experiencia, agregala de forma explícita (en una experiencia concreta, no solo en una lista).`);
    if(sin.length) r.push(`Tu CV usa otras palabras para: ${sin.slice(0, 6).map(s => `“${s.cvAl}” → el aviso dice “${s.mainTxt}”`).join("; ")}. Sumá el término exacto del aviso.`);
    const fd = falta.filter(s => s.pri === "des");
    if(fd.length) r.push(`Deseables que no aparecen: ${lista(fd.map(s => s.mainTxt))}. Si los tenés aunque sea en cursos o proyectos, mencionalos.`);
    const fk = M.kws.filter(k => !k.ok);
    if(fk.length) r.push(`Términos que el aviso repite y tu CV no tiene: ${lista(fk.map(k => k.t), 6)}.`);
    M.req.filter(x => x.ok === false).forEach(x => r.push("Revisá: " + x.t + "."));
    const ff = M.fmt.filter(x => !x.ok);
    if(ff.length) r.push(`Formato: ${ff.map(x => x.t.toLowerCase()).join("; ")}.`);
    if(!r.length) r.push("¡Muy buen match! Revisá que lo más relevante para este aviso esté en el primer tercio del CV.");
    r.push("Sumá solo lo que sea cierto: los ATS filtran, pero después lee una persona.");
    return r;
  }

  root.ATS = {norm, reTerm, buildDict, analyzeJob, matchCV, classify, CATS, PRI, BASE_COUNT: BASE.length, BASE, MOTOR: "reglas-1"};
})(typeof window !== "undefined" ? window : globalThis);
</script>

<!-- ===== App ===== -->
<script>
(function(){
  "use strict";
  const A = window.ATS;
  const KEY = "jobpost_app_v1";
  const FORMATO = 1;
  const $ = (s, el = document) => el.querySelector(s);
  const main = $("#main");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const fmtD = t => new Date(t).toLocaleString("es-AR", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});
  const hash = s => { let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
  const appV = () => (document.querySelector('meta[name="app-version"]') || {}).content || "";
  const TABS = [["aviso","📄","Aviso"], ["match","🎯","Match CV"], ["hist","🕘","Historial"], ["dic","📚","Diccionario"]];
  const nivel = s => s >= 75 ? "ok" : s >= 50 ? "mid" : "bad";
  const nivelTxt = s => s >= 75 ? "Alto" : s >= 50 ? "Medio" : "Bajo";

  // ---------- Estado ----------
  const nuevo = () => ({aviso: {puesto: "", empresa: "", texto: ""}, cv: "", history: [], custom: [], tab: "aviso"});
  let S;
  try{ S = Object.assign(nuevo(), JSON.parse(localStorage.getItem(KEY) || "null") || {}); }catch(e){ S = nuevo(); }
  let saveT;
  function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("No se pudo guardar en el navegador (espacio lleno)."); } }, 250); }
  let DICT = A.buildDict(S.custom);
  const rebuild = () => { DICT = A.buildDict(S.custom); };
  let JOB = null, MATCH = null;

  // ---------- Render ----------
  function render(){
    $("#tabs").innerHTML = TABS.map(([k, i, t]) => `<button type="button" data-tab="${k}" class="${S.tab === k ? "on" : ""}"><span>${i}</span>${t}</button>`).join("");
    ({aviso: vAviso, match: vMatch, hist: vHist, dic: vDic})[S.tab]();
  }
  $("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(!b) return; ir(b.dataset.tab); });
  function ir(tab){ S.tab = tab; save(); render(); window.scrollTo(0, 0); }

  const cabPrint = sub => `<div class="printonly"><b>Job Post ATS Analizer</b> · ${esc(sub)} · ${esc(S.aviso.puesto || "")}${S.aviso.empresa ? " · " + esc(S.aviso.empresa) : ""} · ${fmtD(Date.now())}</div>`;
  const chip = (s, extra = "") => `<span class="chip c-${s.c}" title="${esc(A.CATS[s.c])} · ${s.n} vez/veces · término del aviso: ${esc(s.mainTxt)}">${esc(s.l)}${s.n > 1 ? ` <b>×${s.n}</b>` : ""}${extra}</span>`;

  // ----- Aviso -----
  function vAviso(){
    main.innerHTML = `<div class="card noprint">
      <h2>Aviso de trabajo</h2>
      <div class="g2">
        <label>Puesto<input id="fPuesto" value="${esc(S.aviso.puesto)}" placeholder="Ej. Analista Funcional Sr"></label>
        <label>Empresa<input id="fEmpresa" value="${esc(S.aviso.empresa)}" placeholder="Opcional"></label>
      </div>
      <label class="mt">Texto del aviso<textarea id="fAviso" rows="10" placeholder="Pegá acá el aviso completo, en español o en inglés.">${esc(S.aviso.texto)}</textarea></label>
      <div class="acts">
        <button class="btn pri" data-act="analizar" type="button">🔍 Analizar aviso</button>
        <button class="btn" data-act="ejemplo" type="button">Ejemplo</button>
        <button class="btn" data-act="limpiar" type="button">Limpiar</button>
      </div>
    </div><div id="resAviso"></div>`;
    $("#fPuesto").oninput = e => { S.aviso.puesto = e.target.value; save(); };
    $("#fEmpresa").oninput = e => { S.aviso.empresa = e.target.value; save(); };
    $("#fAviso").oninput = e => { S.aviso.texto = e.target.value; save(); };
    if(S.aviso.texto.trim()) analizar(false);
  }
  function analizar(guardar){
    const t = S.aviso.texto.trim();
    if(!t){ toast("Pegá el texto del aviso primero."); return; }
    if(!S.aviso.puesto.trim()){
      const first = (t.split(/\n/).map(x => x.trim()).find(Boolean) || "").replace(/^[^\p{L}\p{N}]+/u, "");
      if(first.length <= 80 && !/:$/.test(first)){ S.aviso.puesto = first; const f = $("#fPuesto"); if(f) f.value = first; save(); }
    }
    JOB = A.analyzeJob(t, {dict: DICT});
    if(guardar) guardarHist();
    const r = $("#resAviso"); if(r) r.innerHTML = htmlJob(JOB);
    if(guardar && r) r.scrollIntoView({behavior: "smooth", block: "start"});
  }
  function htmlJob(J){
    const v = (arr, vacio = "No se menciona") => arr && arr.length ? esc(arr.join(" · ")) : `<span class="mut">${vacio}</span>`;
    const exc = J.skills.filter(s => s.pri === "exc" || s.pri === "req").length;
    const grupos = Object.keys(A.PRI).map(p => {
      const ss = J.skills.filter(s => s.pri === p); if(!ss.length) return "";
      return `<div class="pri-h">${A.PRI[p].n} <small>${ss.length}</small></div><div class="chips">${ss.map(s => chip(s)).join("")}</div>`;
    }).join("");
    const cats = {}; J.skills.forEach(s => cats[s.c] = (cats[s.c] || 0) + 1);
    const secN = {exc: "Excluyentes", req: "Requisitos", resp: "Responsabilidades", des: "Deseables", ben: "Beneficios", emp: "Empresa", otro: "Otra"};
    return `${cabPrint("Análisis del aviso")}
    <div class="card"><h2>Resumen del puesto</h2>
      <dl class="kv">
        <dt>Idioma del aviso</dt><dd>${esc(J.lang.txt)}</dd>
        <dt>Seniority</dt><dd>${v(J.seniority)}</dd>
        <dt>Experiencia pedida</dt><dd>${J.years ? J.years + "+ años" : '<span class="mut">No se menciona</span>'}</dd>
        <dt>Modalidad</dt><dd>${v(J.modalidad)}</dd>
        <dt>Jornada</dt><dd>${v(J.jornada)}</dd>
        <dt>Contratación</dt><dd>${v(J.contrato)}</dd>
        <dt>Idiomas</dt><dd>${J.idiomas.length ? esc(J.idiomas.map(i => i.n + " (" + i.txt.toLowerCase() + ")").join(" · ")) : '<span class="mut">No se menciona</span>'}</dd>
        <dt>Educación</dt><dd>${v(J.educacion)}</dd>
        <dt>Remuneración</dt><dd>${J.salario ? "Se menciona" : '<span class="mut">No se menciona</span>'}</dd>
        <dt>Beneficios</dt><dd>${v(J.beneficios)}</dd>
        <dt>Secciones</dt><dd>${J.secs.length ? esc(J.secs.map(s => secN[s]).join(" · ")) : '<span class="mut">Sin títulos de sección: todo se toma como general</span>'}</dd>
      </dl>
    </div>
    <div class="card"><h2>Palabras clave del aviso</h2>
      <p class="sm mut">${J.skills.length} términos detectados · ${exc} excluyentes o requisitos. Tocá un término para ver cuántas veces aparece.</p>
      ${grupos || '<p class="mut">No se detectaron términos del diccionario.</p>'}
      ${J.skills.length ? `<div class="leg">${Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<span class="chip c-${c}">${esc(A.CATS[c])} ${n}</span>`).join("")}</div>` : ""}
    </div>
    ${J.keywords.length ? `<div class="card"><h2>Términos repetidos no catalogados</h2>
      <p class="sm mut">El aviso los repite y no están en el diccionario. Con <b>+</b> los sumás como término propio.</p>
      <div class="chips">${J.keywords.map(k => `<span class="chip">${esc(k.t)} <b>×${k.n}</b><button type="button" class="noprint" data-act="addkw" data-t="${esc(k.t)}" title="Sumar al diccionario">+</button></span>`).join("")}</div></div>` : ""}
    ${J.anglicismos.length ? `<div class="card"><h2>Términos en inglés</h2><div class="chips">${J.anglicismos.map(t => `<span class="chip c-L">${esc(t)}</span>`).join("")}</div></div>` : ""}
    <div class="card"><h2>Recomendaciones para tu CV</h2><ul class="recs">${J.recs.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      <div class="acts noprint">
        <button class="btn pri" data-act="irMatch" type="button">🎯 Comparar con mi CV</button>
        <button class="btn" data-act="csvJob" type="button">⬇ CSV</button>
        <button class="btn" data-act="print" type="button">🖨 Imprimir / PDF</button>
      </div></div>`;
  }

  // ----- Match -----
  function vMatch(){
    const hay = !!S.aviso.texto.trim();
    main.innerHTML = `<div class="card noprint"><h2>Match aviso + CV</h2>
      <p class="sm ${hay ? "mut" : "warn"}">${hay ? `Aviso: <b>${esc(S.aviso.puesto || "(sin título)")}</b>${S.aviso.empresa ? " · " + esc(S.aviso.empresa) : ""} — <a href="#" data-act="irAviso">cambiar</a>` : `Primero pegá un aviso en la pestaña <a href="#" data-act="irAviso">Aviso</a>.`}</p>
      <label>Texto de tu CV<textarea id="fCV" rows="10" placeholder="Pegá el texto completo de tu CV.">${esc(S.cv)}</textarea></label>
      <p class="sm mut">Tu CV queda guardado solo en este navegador. Próximamente: importar PDF, .docx y JSON, y leerlo desde CVAPP.</p>
      <div class="acts">
        <button class="btn pri" data-act="comparar" type="button">🎯 Comparar</button>
        <button class="btn" data-act="borrarCV" type="button">Borrar CV</button>
      </div></div><div id="resMatch"></div>`;
    $("#fCV").oninput = e => { S.cv = e.target.value; save(); };
    if(hay && S.cv.trim()) comparar(false);
  }
  function comparar(guardar){
    if(!S.aviso.texto.trim()){ toast("Primero pegá un aviso en la pestaña Aviso."); return; }
    if(!S.cv.trim()){ toast("Pegá el texto de tu CV."); return; }
    JOB = A.analyzeJob(S.aviso.texto, {dict: DICT});
    MATCH = A.matchCV(S.cv, JOB, DICT, S.aviso.puesto);
    if(guardar) guardarHist(MATCH.score);
    const r = $("#resMatch"); if(r){ r.innerHTML = htmlMatch(MATCH); if(guardar) r.scrollIntoView({behavior: "smooth", block: "start"}); }
  }
  function htmlMatch(M){
    const nv = nivel(M.score);
    const ico = {exacto: "✅", sinonimo: "🟡", falta: "❌"};
    const rows = M.skills.map(s => `<tr><td>${esc(A.PRI[s.pri].n.replace(/s$/, "").replace("Generale", "General").replace("En beneficio", "Beneficio"))}</td>
      <td>${esc(s.l)}<small>en el aviso: “${esc(s.mainTxt)}”</small></td>
      <td class="st">${ico[s.st]} ${s.st === "exacto" ? "Exacto" : s.st === "sinonimo" ? "Sinónimo" : "Falta"}${s.st === "sinonimo" ? `<small>tu CV: “${esc(s.cvAl)}”</small>` : ""}</td></tr>`).join("");
    const li = x => `<li><span>${x.ok === true ? "✅" : x.ok === false ? "❌" : "❔"}</span><span>${esc(x.t)}</span></li>`;
    return `${cabPrint("Match aviso + CV")}
    <div class="card"><div class="score">
      <div class="big s-${nv}">${M.score}%</div>
      <div style="flex:1"><div class="lbl s-${nv}">Match ${nivelTxt(M.score)}</div>
        <div class="sm mut">Excluyentes y requisitos cubiertos: <b>${M.exc.ok} de ${M.exc.tot}</b> · Términos: ${M.cnt.ex} exactos, ${M.cnt.sin} sinónimos, ${M.cnt.fal} faltan${M.kws.length ? ` · Repetidos: ${M.kws.filter(k => k.ok).length} de ${M.kws.length}` : ""}</div>
        <div class="meter"><i class="b-${nv}" style="width:${M.score}%"></i></div></div>
    </div>
    <p class="sm mut" style="margin:10px 0 0">Estimación del motor local por reglas: pondera excluyentes ×3, requisitos ×2,5, responsabilidades ×1,5 y deseables ×1. Un sinónimo vale 75% de una coincidencia exacta.</p></div>
    ${M.skills.length ? `<div class="card"><h2>Términos del aviso en tu CV</h2><table class="t"><thead><tr><th>Prioridad</th><th>Término</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>` : ""}
    ${M.kws.length ? `<div class="card"><h2>Términos repetidos del aviso</h2><div class="chips">${M.kws.map(k => `<span class="chip ${k.ok ? "ok" : "no"}">${k.ok ? "✓" : "✗"} ${esc(k.t)}</span>`).join("")}</div></div>` : ""}
    ${M.req.length ? `<div class="card"><h2>Requisitos del puesto</h2><ul class="chk">${M.req.map(li).join("")}</ul></div>` : ""}
    <div class="card"><h2>Formato apto ATS</h2><ul class="chk">${M.fmt.map(li).join("")}</ul>
      <p class="sm mut" style="margin:8px 0 0">Se revisa el texto pegado. Tablas, columnas e imágenes del archivo original se van a poder revisar cuando se importe el PDF o el .docx.</p></div>
    <div class="card"><h2>Sugerencias</h2><ul class="recs">${M.recs.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      <div class="acts noprint"><button class="btn" data-act="csvMatch" type="button">⬇ CSV</button><button class="btn" data-act="print" type="button">🖨 Imprimir / PDF</button></div></div>`;
  }

  // ----- Historial -----
  function guardarHist(score){
    const t = S.aviso.texto.trim(), h = hash(t);
    let e = S.history.find(x => x.h === h);
    const J = JOB;
    const res = {skills: J.skills.length, exc: J.skills.filter(s => s.pri === "exc" || s.pri === "req").length, seniority: J.seniority, modalidad: J.modalidad,
      top: J.skills.filter(s => s.pri === "exc" || s.pri === "req").slice(0, 8).map(s => s.l)};
    if(!e){ e = {id: uid(), h, at: Date.now()}; S.history.unshift(e); }
    Object.assign(e, {upd: Date.now(), puesto: S.aviso.puesto, empresa: S.aviso.empresa, texto: t, res});
    if(score !== undefined){ e.score = score; e.scoreAt = Date.now(); }
    S.history.sort((a, b) => (b.upd || b.at) - (a.upd || a.at));
    if(S.history.length > 300) S.history.length = 300;
    save();
  }
  function vHist(){
    const H = S.history;
    main.innerHTML = `<div class="card"><div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">Historial de avisos</h2><span class="sm mut">${H.length}</span></div>
      ${H.length ? H.map(e => `<div class="hrow"><div class="ht"><b>${esc(e.puesto || "(sin título)")}</b>${e.empresa ? ` · ${esc(e.empresa)}` : ""}
        <div class="sm mut">${fmtD(e.upd || e.at)} · ${e.res ? `${e.res.skills} términos, ${e.res.exc} excluyentes/requisitos` : ""}${e.res && e.res.seniority && e.res.seniority.length ? " · " + esc(e.res.seniority.join(", ")) : ""}${e.res && e.res.modalidad && e.res.modalidad.length ? " · " + esc(e.res.modalidad.join(", ")) : ""}</div>
        ${typeof e.score === "number" ? `<span class="badge ${nivel(e.score)}">Match ${e.score}%</span>` : ""}</div>
        <div class="ha noprint"><button class="btn xs" data-act="abrir" data-id="${e.id}" type="button">Abrir</button><button class="btn xs" data-act="abrirMatch" data-id="${e.id}" type="button">Match</button><button class="ic" data-act="delHist" data-id="${e.id}" type="button" title="Borrar">🗑</button></div></div>`).join("")
        : '<p class="mut">Todavía no hay avisos. Cada aviso que analizás se guarda acá, solo en este navegador.</p>'}
      ${H.length ? `<div class="acts noprint"><button class="btn" data-act="csvHist" type="button">⬇ Exportar CSV</button><button class="btn danger" data-act="clearHist" type="button">Borrar historial</button></div>` : ""}</div>`;
  }
  function cargar(id, tab){
    const e = S.history.find(x => x.id === id); if(!e) return;
    S.aviso = {puesto: e.puesto || "", empresa: e.empresa || "", texto: e.texto || ""};
    ir(tab);
  }

  // ----- Diccionario -----
  let busq = "";
  function vDic(){
    const opts = Object.entries(A.CATS).map(([k, v]) => `<option value="${k}"${k === "P" ? " selected" : ""}>${esc(v)}</option>`).join("");
    main.innerHTML = `<div class="card"><h2>Diccionario de términos</h2>
      <p class="sm mut">Base del motor local: <b>${A.BASE_COUNT}</b> términos en ${Object.keys(A.CATS).length - 1} categorías, con sinónimos en español e inglés. Tus términos propios (<b>${S.custom.length}</b>) se suman a la base, quedan en este navegador y viajan en el backup JSON.</p>
      <h3>Agregar término propio</h3>
      <div class="g3">
        <label>Término<input id="dT" placeholder="Ej. Medios de pago"></label>
        <label>Sinónimos (separados por coma)<input id="dA" placeholder="Ej. pagos digitales, payments"></label>
        <label>Categoría<select id="dC">${opts}</select></label>
        <button class="btn pri" data-act="addDic" type="button">Agregar</button>
      </div>
      <p class="sm mut">Si el término ya existe en la base, sus sinónimos se le suman.</p>
    </div>
    <div class="card"><h2>Términos propios</h2>
      ${S.custom.length ? S.custom.map(c => `<div class="hrow"><div class="ht"><span class="chip c-${esc(c.c)}">${esc(c.l)}</span> <span class="sm mut">${esc(A.CATS[c.c] || "Propios")}${c.al && c.al.length ? " · " + esc(c.al.join(", ")) : ""}</span></div>
        <div class="ha"><button class="ic" data-act="delDic" data-id="${c.id}" type="button" title="Borrar">🗑</button></div></div>`).join("") : '<p class="mut">Todavía no agregaste términos. También podés sumarlos desde “Términos repetidos no catalogados” en el análisis del aviso.</p>'}
    </div>
    <div class="card"><h2>Buscar en el diccionario</h2>
      <input id="dB" placeholder="Buscá un término o sinónimo" value="${esc(busq)}"><div id="dRes" class="mt"></div>
      <p class="sm mut">Próximamente: el motor con IA va a proponer términos y reglas nuevas para que las apruebes antes de sumarlas.</p></div>`;
    const lst = () => {
      const q = A.norm(busq).trim(); const el = $("#dRes");
      if(q.length < 2){ el.innerHTML = '<p class="sm mut">Escribí al menos 2 letras.</p>'; return; }
      const r = DICT.filter(e => e.al.some(a => a.t.includes(q))).slice(0, 40);
      el.innerHTML = r.length ? r.map(e => `<div class="hrow"><div class="ht"><span class="chip c-${e.c}">${esc(e.l)}</span> <span class="sm mut">${esc(A.CATS[e.c])}${e.src !== "base" ? " · propio" : e.ext ? " · con sinónimos propios" : ""}</span>
        <div class="sm mut">${esc(e.al.map(a => a.t).join(", "))}</div></div></div>`).join("") : '<p class="sm mut">Sin resultados.</p>';
    };
    $("#dB").oninput = e => { busq = e.target.value; lst(); };
    lst();
  }
  function addCustom(l, al, c){
    l = String(l || "").trim().slice(0, 80); if(!l){ toast("Escribí el término."); return false; }
    const id = A.norm(l).trim();
    const prev = S.custom.find(x => A.norm(x.l).trim() === id);
    const alias = String(al || "").split(",").map(s => s.trim().slice(0, 80)).filter(Boolean).slice(0, 30);
    if(prev){ prev.al = [...new Set([...(prev.al || []), ...alias])]; }
    else S.custom.push({id: uid(), l, c: A.CATS[c] ? c : "P", al: alias, src: "manual", at: Date.now()});
    rebuild(); save(); return true;
  }

  // ---------- Exportar / importar ----------
  function bajar(nombre, contenido, tipo){
    const url = URL.createObjectURL(new Blob([contenido], {type: tipo}));
    const a = document.createElement("a"); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }
  const celda = v => { v = String(v ?? ""); if(/^[=+\-@\t\r]/.test(v)) v = "'" + v; return /[;"\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const csv = rows => "﻿" + rows.map(r => r.map(celda).join(";")).join("\r\n");
  const slug = s => (A.norm(s || "aviso").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "aviso").slice(0, 40);
  const hoy = () => new Date().toISOString().slice(0, 10);
  function csvJob(){
    if(!JOB) analizar(false); if(!JOB) return;
    const rows = [["Tipo", "Término", "Categoría", "Prioridad", "Apariciones", "Término en el aviso"]];
    JOB.skills.forEach(s => rows.push(["Diccionario", s.l, A.CATS[s.c], A.PRI[s.pri].n, s.n, s.mainTxt]));
    JOB.keywords.forEach(k => rows.push(["Repetido", k.t, "", "", k.n, k.t]));
    rows.push([], ["Dato", "Valor"], ["Puesto", S.aviso.puesto], ["Empresa", S.aviso.empresa], ["Seniority", JOB.seniority.join(", ")], ["Experiencia pedida (años)", JOB.years || ""],
      ["Modalidad", JOB.modalidad.join(", ")], ["Idiomas", JOB.idiomas.map(i => i.n + " " + i.txt).join(", ")], ["Educación", JOB.educacion.join(", ")]);
    bajar(`aviso-${slug(S.aviso.puesto)}-${hoy()}.csv`, csv(rows), "text/csv;charset=utf-8");
  }
  function csvMatch(){
    if(!MATCH) comparar(false); if(!MATCH) return;
    const rows = [["Match", MATCH.score + "%"], [], ["Prioridad", "Término", "Término en el aviso", "Estado", "Término en tu CV"]];
    MATCH.skills.forEach(s => rows.push([A.PRI[s.pri].n, s.l, s.mainTxt, s.st, s.cvAl || ""]));
    MATCH.kws.forEach(k => rows.push(["Repetido", k.t, k.t, k.ok ? "exacto" : "falta", ""]));
    rows.push([], ["Requisito", "Resultado"]); MATCH.req.forEach(x => rows.push([x.t, x.ok === true ? "OK" : x.ok === false ? "No" : "Revisar"]));
    rows.push([], ["Formato ATS", "Resultado"]); MATCH.fmt.forEach(x => rows.push([x.t, x.ok ? "OK" : "No"]));
    bajar(`match-${slug(S.aviso.puesto)}-${hoy()}.csv`, csv(rows), "text/csv;charset=utf-8");
  }
  function csvHist(){
    const rows = [["Fecha", "Puesto", "Empresa", "Términos", "Excluyentes / requisitos", "Principales", "Seniority", "Modalidad", "Match %"]];
    S.history.forEach(e => rows.push([fmtD(e.upd || e.at), e.puesto, e.empresa, e.res ? e.res.skills : "", e.res ? e.res.exc : "", e.res && e.res.top ? e.res.top.join(", ") : "",
      e.res && e.res.seniority ? e.res.seniority.join(", ") : "", e.res && e.res.modalidad ? e.res.modalidad.join(", ") : "", typeof e.score === "number" ? e.score : ""]));
    bajar(`historial-avisos-${hoy()}.csv`, csv(rows), "text/csv;charset=utf-8");
  }
  function backup(){
    const data = {app: "jobpost", tipo: "backup", formato: FORMATO, version: appV(), motor: A.MOTOR, exportado: new Date().toISOString(),
      data: {aviso: S.aviso, cv: S.cv, history: S.history, custom: S.custom}};
    bajar(`jobpost-backup-${hoy()}.json`, JSON.stringify(data, null, 2), "application/json");
    toast("Backup descargado. Ojo: incluye tu CV.");
  }
  // Validación del JSON importado: solo datos, con tipos y largos controlados
  const str = (v, max) => typeof v === "string" ? v.slice(0, max) : "";
  function limpiar(d){
    const out = {history: [], custom: [], cv: str(d.cv, 60000), aviso: null};
    if(d.aviso && typeof d.aviso === "object") out.aviso = {puesto: str(d.aviso.puesto, 200), empresa: str(d.aviso.empresa, 200), texto: str(d.aviso.texto, 60000)};
    (Array.isArray(d.history) ? d.history : []).slice(0, 300).forEach(e => {
      if(!e || typeof e !== "object" || typeof e.texto !== "string") return;
      const t = e.texto.slice(0, 60000);
      out.history.push({id: str(e.id, 20) || uid(), h: hash(t.trim()), at: +e.at || Date.now(), upd: +e.upd || +e.at || Date.now(), puesto: str(e.puesto, 200), empresa: str(e.empresa, 200), texto: t,
        res: e.res && typeof e.res === "object" ? {skills: +e.res.skills || 0, exc: +e.res.exc || 0, seniority: (Array.isArray(e.res.seniority) ? e.res.seniority : []).map(x => str(x, 40)).slice(0, 6),
          modalidad: (Array.isArray(e.res.modalidad) ? e.res.modalidad : []).map(x => str(x, 40)).slice(0, 4), top: (Array.isArray(e.res.top) ? e.res.top : []).map(x => str(x, 80)).slice(0, 8)} : null,
        ...(typeof e.score === "number" && e.score >= 0 && e.score <= 100 ? {score: Math.round(e.score), scoreAt: +e.scoreAt || 0} : {})});
    });
    (Array.isArray(d.custom) ? d.custom : []).slice(0, 2000).forEach(c => {
      if(!c || typeof c !== "object" || !str(c.l, 80).trim()) return;
      out.custom.push({id: str(c.id, 20) || uid(), l: str(c.l, 80).trim(), c: A.CATS[c.c] ? c.c : "P", al: (Array.isArray(c.al) ? c.al : []).map(x => str(x, 80).trim()).filter(Boolean).slice(0, 30),
        src: ["manual", "ia", "importado"].includes(c.src) ? c.src : "importado", at: +c.at || Date.now()});
    });
    return out;
  }
  function importar(file){
    if(!file) return;
    if(file.size > 5 * 1024 * 1024){ toast("El archivo pesa más de 5 MB."); return; }
    const rd = new FileReader();
    rd.onload = () => {
      let o; try{ o = JSON.parse(rd.result); }catch(e){ toast("El archivo no es un JSON válido."); return; }
      if(!o || o.app !== "jobpost" || o.tipo !== "backup" || !o.data){ toast("Este JSON no es un backup de Job Post ATS."); return; }
      if(+o.formato > FORMATO){ toast("El backup es de una versión más nueva de la app. Recargá para actualizarla."); return; }
      const d = limpiar(o.data);
      dlg(`<h3>Importar backup</h3><p>El archivo trae <b>${d.history.length}</b> avisos, <b>${d.custom.length}</b> términos propios${d.cv ? " y un CV" : ""}${o.exportado ? ` (exportado el ${esc(fmtD(o.exportado))})` : ""}.</p>
        <p class="sm mut"><b>Combinar</b> suma lo nuevo y conserva lo que ya tenés. <b>Reemplazar</b> borra tus datos actuales y deja solo los del archivo.</p>
        <div class="acts"><button class="btn" data-x type="button">Cancelar</button><button class="btn danger" id="impRep" type="button">Reemplazar</button><button class="btn pri" id="impComb" type="button">Combinar</button></div>`);
      $("#impComb").onclick = () => {
        d.history.forEach(e => { const ex = S.history.find(x => x.h === e.h || x.id === e.id); if(!ex) S.history.push(e); else if((e.upd || 0) > (ex.upd || 0)) Object.assign(ex, e); });
        S.history.sort((a, b) => (b.upd || b.at) - (a.upd || a.at));
        d.custom.forEach(c => { const ex = S.custom.find(x => A.norm(x.l).trim() === A.norm(c.l).trim()); if(ex) ex.al = [...new Set([...(ex.al || []), ...c.al])]; else S.custom.push(c); });
        if(!S.cv.trim() && d.cv) S.cv = d.cv;
        if(!S.aviso.texto.trim() && d.aviso) S.aviso = d.aviso;
        fin("Backup combinado.");
      };
      $("#impRep").onclick = () => { S.history = d.history; S.custom = d.custom; S.cv = d.cv; S.aviso = d.aviso || {puesto: "", empresa: "", texto: ""}; fin("Datos reemplazados por el backup."); };
      function fin(m){ rebuild(); save(); $("#dlg").close(); render(); toast(m); }
    };
    rd.readAsText(file);
  }
  $("#fileIn").addEventListener("change", e => { importar(e.target.files[0]); e.target.value = ""; });

  // ---------- Diálogos ----------
  function dlg(html){ const d = $("#dlg"); d.innerHTML = html; d.querySelectorAll("[data-x]").forEach(b => b.onclick = () => d.close()); if(!d.open) d.showModal(); return d; }
  $("#dlg").addEventListener("click", e => { if(e.target.id === "dlg") e.target.close(); });
  function confirmar(titulo, texto, btn, fn){
    dlg(`<h3>${esc(titulo)}</h3><p>${esc(texto)}</p><div class="acts"><button class="btn" data-x type="button">Cancelar</button><button class="btn danger" id="okC" type="button">${esc(btn)}</button></div>`);
    $("#okC").onclick = () => { $("#dlg").close(); fn(); };
  }
  $("#menuBtn").addEventListener("click", () => {
    dlg(`<h3>Opciones</h3><div class="menu">
      <button class="btn" data-act="backup" type="button">💾 Exportar backup (.json)</button>
      <button class="btn" data-act="importar" type="button">📂 Importar backup (.json)</button>
      <button class="btn" data-act="csvHist" type="button">⬇ Exportar historial (.csv)</button>
      <button class="btn" data-act="print" type="button">🖨 Imprimir / PDF de la pestaña actual</button>
      <button class="btn" data-act="privacidad" type="button">🔒 Privacidad y datos</button>
      <button class="btn danger" data-act="borrarTodo" type="button">Borrar todos los datos</button>
      </div><div class="acts"><button class="btn" data-x type="button">Cerrar</button></div>`);
  });

  // ---------- Acciones ----------
  const EJEMPLO = {puesto: "Analista Funcional Sr", empresa: "Fintech (ejemplo)", texto:
`Analista Funcional Sr

Sobre nosotros:
Somos una fintech con más de 10 años en el mercado, con foco en medios de pago.

Responsabilidades:
- Relevar y documentar requerimientos funcionales junto a los stakeholders del negocio.
- Escribir user stories y criterios de aceptación en Jira.
- Modelar procesos de negocio en BPMN.
- Participar de las ceremonias Scrum (daily, sprint planning, review).
- Coordinar las pruebas UAT con usuarios clave.

Requisitos excluyentes:
- 4+ años de experiencia como Analista Funcional o Business Analyst.
- Experiencia en metodologías ágiles (Scrum / Kanban).
- Conocimientos de SQL para consultas.
- Inglés intermedio-avanzado (B2).

Deseables:
- Experiencia en banca o medios de pago.
- Conocimientos de APIs REST y Postman.
- Manejo de Power BI.
- Certificación PSPO o CBAP.

Ofrecemos:
- Modalidad híbrida (2 días en oficina).
- Relación de dependencia, full time.
- Prepaga, bono anual y capacitaciones.`};
  const ACT = {
    analizar: () => analizar(true),
    ejemplo: () => { const go = () => { S.aviso = {...EJEMPLO}; save(); vAviso(); analizar(true); }; S.aviso.texto.trim() ? confirmar("Cargar ejemplo", "Se reemplaza el aviso que tenés cargado (queda en el historial si lo analizaste).", "Cargar", go) : go(); },
    limpiar: () => { S.aviso = {puesto: "", empresa: "", texto: ""}; JOB = null; save(); vAviso(); },
    irAviso: () => ir("aviso"), irMatch: () => ir("match"),
    comparar: () => comparar(true),
    borrarCV: () => confirmar("Borrar CV", "Se borra el texto del CV guardado en este navegador.", "Borrar", () => { S.cv = ""; MATCH = null; save(); vMatch(); }),
    csvJob, csvMatch, csvHist, backup,
    print: () => { const d = $("#dlg"); if(d.open) d.close(); setTimeout(() => window.print(), 50); },
    addkw: b => { if(addCustom(b.dataset.t, "", "P")){ toast(`“${b.dataset.t}” sumado al diccionario.`); analizar(false); } },
    abrir: b => cargar(b.dataset.id, "aviso"), abrirMatch: b => cargar(b.dataset.id, "match"),
    delHist: b => confirmar("Borrar aviso", "Se borra este aviso del historial.", "Borrar", () => { S.history = S.history.filter(x => x.id !== b.dataset.id); save(); vHist(); }),
    clearHist: () => confirmar("Borrar historial", "Se borran todos los avisos del historial. Si querés conservarlos, exportá un backup antes.", "Borrar todo", () => { S.history = []; save(); vHist(); }),
    addDic: () => { if(addCustom($("#dT").value, $("#dA").value, $("#dC").value)){ toast("Término agregado."); vDic(); } },
    delDic: b => { S.custom = S.custom.filter(x => x.id !== b.dataset.id); rebuild(); save(); vDic(); },
    importar: () => { $("#dlg").close(); $("#fileIn").click(); },
    privacidad: () => dlg(`<h3>Privacidad y datos</h3>
      <p>Todo se procesa y se guarda <b>solo en este navegador</b>: avisos, historial, tu CV y tus términos propios. Nada se sube al repositorio ni a otro servidor.</p>
      <p class="sm mut">Si borrás los datos del navegador, se pierden: usá “Exportar backup” para tener una copia. El backup incluye tu CV, así que guardalo en un lugar privado.</p>
      <div class="acts"><button class="btn pri" data-x type="button">Entendido</button></div>`),
    borrarTodo: () => confirmar("Borrar todos los datos", "Se borran el aviso, el CV, el historial y los términos propios de este navegador. No se puede deshacer.", "Borrar todo", () => { S = nuevo(); JOB = MATCH = null; rebuild(); save(); render(); toast("Datos borrados."); })
  };
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if(!b || !ACT[b.dataset.act]) return;
    e.preventDefault(); ACT[b.dataset.act](b);
  });

  let tt;
  function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }

  render();
})();
</script>
<!-- ===== Versión (estándar caja de apps) — bloque autónomo =====
     Requiere en el <head>: <meta name="app-version" content="vX.Y.Z">
     y en el encabezado: <button id="verBtn" class="vs-ver" type="button">v—</button>
     (o, si la app ya muestra su propio texto de versión, marcar ese elemento con data-vs-open:
      al tocarlo abre el diálogo y no se le cambia el texto).
     1) El número escrito en el HTML se ve siempre (sin conexión, Apps Script, caché vieja).
     2) Fecha y Changelog desde las Releases de GitHub (sin conexión: última copia guardada).
     3) Si GitHub tiene una versión más alta: aviso "Hay una versión nueva, recargá". -->
<style>
  .vs-ver{border:1px solid #d0d5dd;background:#fff;color:#555;font:600 12px system-ui,sans-serif;padding:3px 10px;border-radius:999px;cursor:pointer;vertical-align:middle}
  .vs-ver.new,[data-vs-open].new{border-color:#d97706;color:#d97706}
  [data-vs-open]{cursor:pointer}
  .vs-upd{display:none;position:sticky;top:0;z-index:9998;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:#f59e0b;color:#1c1f26;font:14px system-ui,sans-serif}
  .vs-upd.on{display:flex}
  .vs-upd button,.vs-dlg .vs-acts button,.vs-dlg .vs-acts a{border:1px solid #c9ced6;border-radius:10px;padding:8px 13px;background:#fff;color:#1c1f26;font:14px system-ui,sans-serif;cursor:pointer;text-decoration:none}
  .vs-upd button{border-color:#1c1f26;background:#1c1f26;color:#fff}
  .vs-dlg{border:1px solid #d0d5dd;border-radius:16px;padding:20px;max-width:min(560px,92vw);width:100%;font:15px/1.45 system-ui,sans-serif;color:#1c1f26;background:#fff}
  .vs-dlg h3{margin:0 0 8px}.vs-dlg .vs-mut{color:#6b7280}
  .vs-dlg .vs-rels{max-height:60vh;overflow:auto}
  .vs-dlg .vs-rel{border-top:1px solid #e5e7eb;padding:10px 0}.vs-dlg .vs-rel pre{white-space:pre-wrap;font:inherit;font-size:14px;color:#6b7280;margin:4px 0 0}
  .vs-dlg .vs-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
  @media print{.vs-ver,.vs-upd,.vs-dlg{display:none!important}}
  .vs-dlg .vs-acts .vs-pri{background:#0f766e;border-color:#0f766e;color:#fff}
</style>
<div class="vs-upd" id="vsUpd" role="status"><span id="vsUpdTxt">Hay una versión nueva, recargá.</span><button type="button" id="vsUpdBtn">Recargar</button></div>
<dialog class="vs-dlg" id="vsDlg"></dialog>
<script>
(function(){
  const REPO = "luchorcompartidos/jobpost";                       // usuario/repo de GitHub
  const LOG_FN = "";                   // función propia de Changelog de la app (vacío = usar el de GitHub)
  const KEY  = "vs_rels_" + REPO;
  const APP_VERSION = (document.querySelector('meta[name="app-version"]')||{}).content || "v—";
  const $ = id => document.getElementById(id);
  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = s => new Date(s).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const semv = t => (String(t).replace(/^v/,"").split(".").map(n=>parseInt(n)||0).concat([0,0,0])).slice(0,3);
  const cmpV = (a,b) => { const x=semv(a), y=semv(b); for(let i=0;i<3;i++) if(x[i]!==y[i]) return y[i]-x[i]; return 0; };
  let rels = null; try{ rels = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  // Estado de la última consulta a GitHub: así el diálogo distingue "no está publicada" de "no se pudo consultar"
  let relsAt = 0; try{ relsAt = +localStorage.getItem(KEY+"_t") || 0; }catch(e){}
  let lastFail = false, loading = null;
  // Si el diálogo quedó fuera del <body> (bloque pegado al final), lo movemos
  [$("vsUpd"),$("vsDlg")].forEach(el=>{ if(el && el.parentNode!==document.body) document.body.appendChild(el); });
  document.body.insertBefore($("vsUpd"), document.body.firstChild);
  // Dentro de Apps Script la app sale de la copia del script: recargar no alcanza, hay que actualizarlo.
  const GAS = !!(window.google && window.google.script && window.google.script.run);
  const REL_URL = `https://github.com/${REPO}/releases`;
  if(GAS){ const ub=$("vsUpdBtn"); ub.textContent = "Ver Releases"; }
  const ultima = () => rels && rels[0];
  const hayNueva = () => !!(ultima() && APP_VERSION!=="v—" && cmpV(ultima().tag, APP_VERSION) < 0);
  function show(){
    const b = $("verBtn"), n = hayNueva();
    if(b){ b.textContent = APP_VERSION + (n?" ⬆":""); b.classList.toggle("new", n); b.title = n ? "Hay una versión nueva: "+ultima().tag : "Versión"; }
    document.querySelectorAll("[data-vs-open]").forEach(el=>{ el.classList.toggle("new", n); if(n) el.title = "Hay una versión nueva: "+ultima().tag; });
    $("vsUpd").classList.toggle("on", n);
    if(n) $("vsUpdTxt").textContent = GAS ? `Hay una versión nueva (${ultima().tag}): actualizá el script de Apps Script.`
                                          : `Hay una versión nueva (${ultima().tag}), recargá.`;
  }
  function load(){ if(!loading) loading = doLoad().finally(()=>{ loading = null; }); return loading; }
  async function doLoad(){
    try{
      const r = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});
      if(!r.ok){ lastFail = true; return; }
      lastFail = false; relsAt = Date.now(); try{ localStorage.setItem(KEY+"_t", String(relsAt)); }catch(e){}
      rels = (await r.json()).filter(x=>!x.draft && !x.prerelease).map(x=>{
        const f = (x.assets||[]).map(a=>a.updated_at).filter(Boolean).sort();
        return { tag:x.tag_name, date:f.length?f[f.length-1]:(x.published_at||x.created_at), deArchivo:f.length>0, body:x.body||"" };
      }).sort((a,b)=>cmpV(a.tag,b.tag));
      try{ localStorage.setItem(KEY, JSON.stringify(rels)); }catch(e){}
      show();
    }catch(e){ lastFail = true; }
  }
  function recargar(){ if(GAS){ window.open(REL_URL, "_blank", "noopener"); return; } const u = new URL(location.href); u.searchParams.set("v", Date.now()); location.replace(u); }
  function dlg(html){
    const d = $("vsDlg"); d.innerHTML = html;
    d.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>d.close());
    if(!d.open) d.showModal(); return d;
  }
  let reintento = false;
  function openVer(){
    const r = (rels||[]).find(x=>x.tag===APP_VERSION), n = hayNueva();
    const hace = relsAt ? ` (información de hace ${Math.max(1, Math.round((Date.now()-relsAt)/60000))} min)` : "";
    // Si la lista guardada no tiene esta versión, se vuelve a consultar GitHub antes de concluir nada
    if(!r && !reintento && navigator.onLine !== false){ reintento = true; dlg(`<h3>Versión ${esc(APP_VERSION)}</h3><p class="vs-mut">Consultando GitHub…</p>`); load().then(()=>{ if($("vsDlg").open) openVer(); reintento = false; }); return; }
    const fecha = r ? (r.deArchivo?"Archivos actualizados el ":"Publicada el ")+"<b>"+fmt(r.date)+"</b>"
                    : navigator.onLine === false ? `Sin conexión: no se puede consultar GitHub ahora${rels ? hace : ""}.`
                    : lastFail ? `No se pudo consultar GitHub (puede ser un límite de consultas seguidas). Probá de nuevo en unos minutos${rels ? hace : ""}.`
                    : rels ? "Esta versión todavía no figura en las Releases de GitHub. Se publica unos segundos después de cada entrega: probá de nuevo en un minuto."
                    : "Fecha no disponible (requiere conexión).";
    const d = dlg(`<h3>Versión ${esc(APP_VERSION)}</h3><p class="vs-mut">${fecha}</p>${n?`<p><b>Hay una versión nueva: ${esc(ultima().tag)}.</b>${GAS?" Para usarla, actualizá el script de Apps Script.":""}</p>`:""}
      <div class="vs-acts">${n?`<button class="vs-pri" id="vsRec" type="button">${GAS?"Ver Releases":"↻ Recargar"}</button>`:""}<button ${n?"":'class="vs-pri"'} id="vsLog" type="button">📋 Changelog</button><button data-x type="button">Cerrar</button></div>`);
    d.querySelector("#vsLog").onclick = () => { if(LOG_FN && typeof window[LOG_FN]==="function"){ d.close(); window[LOG_FN](); } else openLog(); };
    const rb = d.querySelector("#vsRec"); if(rb) rb.onclick = recargar;
  }
  function openLog(){
    const list = (rels||[]).map(r=>`<div class="vs-rel"><b>${esc(r.tag)}</b>${r.tag===APP_VERSION?' <span class="vs-mut">(la que estás usando)</span>':""} · <span class="vs-mut">${fmt(r.date)}</span>${r.body?`<pre>${esc(r.body)}</pre>`:""}</div>`).join("");
    dlg(`<h3>Changelog</h3><div class="vs-rels">${list||'<p class="vs-mut">Sin datos todavía (requiere conexión).</p>'}</div>
      <div class="vs-acts"><a href="${REL_URL}" target="_blank" rel="noopener">Ver Releases en GitHub ↗</a><button data-x type="button">Cerrar</button></div>`);
  }
  $("vsDlg").addEventListener("click", e=>{ if(e.target.id==="vsDlg") e.target.close(); });
  if($("verBtn")) $("verBtn").addEventListener("click", openVer);
  document.querySelectorAll("[data-vs-open]").forEach(el=>el.addEventListener("click", openVer));
  window.VS = { abrir: openVer, version: APP_VERSION, hayNueva };
  $("vsUpdBtn").addEventListener("click", recargar);
  show(); load();
  // Se vuelve a consultar al volver a la app, si la información tiene más de 10 minutos
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && Date.now()-relsAt > 600000) load(); });
  window.addEventListener("online", ()=>load());
})();
</script>
<!-- ===== fin bloque Versión ===== -->
</body>
</html>
